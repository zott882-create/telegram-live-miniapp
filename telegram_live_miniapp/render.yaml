services:
  - type: web
    name: live-zot-live-only
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATA_MODE
        value: sportscore
      - key: COLLECTOR_ENABLED
        value: "0"
      - key: LIVE_PROVIDER
        value: sportscore
      - key: LIVE_CACHE_SECONDS
        value: "120"
      - key: LIVE_BACKGROUND_REFRESH_SECONDS
        value: "120"
      - key: LIVE_COLD_START_ASYNC
        value: "1"
      - key: LIVE_COLD_RETRY_AFTER_SECONDS
        value: "4"
      - key: LAST_GOOD_LIVE_TTL_SECONDS
        value: "7200"
      - key: SPORTSCORE_BASE_URL
        value: https://sportscore.com
      - key: SPORTSCORE_SOURCE_TAG
        value: live-zot-telegram-miniapp
      - key: SPORTSCORE_LIVE_CACHE_SECONDS
        value: "120"
      - key: SPORTSCORE_LIVE_HTML_CACHE_SECONDS
        value: "120"
      - key: SPORTSCORE_DETAIL_CACHE_SECONDS
        value: "120"
      - key: MATCH_DETAIL_FRESH_SECONDS
        value: "120"
      - key: STAT_CACHE_SECONDS
        value: "120"
      - key: EVENT_CACHE_SECONDS
        value: "120"
      - key: SPORTSCORE_SNAPSHOT_DB_ENABLED
        value: "1"
      - key: SPORTSCORE_STATS_REFRESH_WORKERS
        value: "3"
      - key: SPORTSCORE_CACHE_SECONDS
        value: "180"
      - key: SPORTSCORE_HTTP_TIMEOUT
        value: "8"
      - key: ADMIN_UPDATE_MODE
        value: auto
      - key: NOTIFY_STORAGE
        value: auto
      - key: TEAM_LOGO_DOWNLOAD
        value: "0"
