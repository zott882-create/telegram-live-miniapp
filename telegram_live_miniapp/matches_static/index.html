<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const liveCodes=new Set(['1H','HT','2H','ET','BT','P','SUSP','INT','LIVE']);

function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function api(path){return fetch(path,{headers:{Accept:'application/json'}}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||d.errors?.request||`HTTP ${r.status}`);if(d.errors&&Object.keys(d.errors).length)throw new Error(Object.values(d.errors).join(', '));return d})}

function playerPhoto(player,cls='playerpic'){const id=Number(player?.id||0),src=player?.photo||(id?`https://media.api-sports.io/football/players/${id}.png`:'');const fallback=esc(initials(player?.name||'И'));return src?`<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\'${cls.includes('hero')?'playerhero-fallback':'playerpicfallback'}\'>${fallback}</span>'">`:`<span class="${cls.includes('hero')?'playerhero-fallback':'playerpicfallback'}">${fallback}</span>`}
function posName(pos){return ({G:'Вратарь',D:'Защитник',M:'Полузащитник',F:'Нападающий',Goalkeeper:'Вратарь',Defender:'Защитник',Midfielder:'Полузащитник',Attacker:'Нападающий'})[pos]||pos||'Игрок'}
function val(v){return v==null||v===''?'—':v}

function bigLogo(team){return logo(team,'bigfallback')}
function rememberFixtures(items){for(const x of items||[]){const id=Number(x?.fixture?.id);if(id)state.fixtureMap.set(id,x)}}
function buildDates(){const box=$('#datebar');box.innerHTML='';for(let i=-3;i<=3;i++){const d=new Date();d.setDate(d.getDate()+i);const b=document.createElement('button');b.className='date'+(ymd(d)===state.date?' active':'');b.innerHTML=`<small>${i===0?'СЕГОДНЯ':d.toLocaleDateString('ru-RU',{weekday:'short'}).replace('.','').toUpperCase()}</small><b>${String(d.getDate()).padStart(2,'0')}</b>`;b.onclick=()=>{state.date=ymd(d);buildDates();clearSearch();loadFixtures()};box.appendChild(b)}}
function updateQuota(_d){}
function timeLabel(x){const s=x.fixture?.status||{};if(liveCodes.has(s.short))return `${s.elapsed||0}′`;if(finishedCodes.has(s.short))return'ФТ';const date=new Date(x.fixture?.date||'');return Number.isNaN(date.getTime())?'—':date.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}

function matchRow(x){const id=Number(x.fixture?.id),t=x.teams||{},g=x.goals||{},fs=fixtureState(x),tl=timeLabel(x);if(t.home?.id)state['team_'+t.home.id]={team:t.home,venue:{}};if(t.away?.id)state['team_'+t.away.id]={team:t.away,venue:{}};return `<article class="match" onclick="openMatch(${id})"><div class="mtime ${fs==='live'?'live':fs==='upcoming'?'soon':''}">${fs==='live'?'<i class="pulse"></i>':''}<span>${esc(tl)}</span></div><div><div class="teamline">${logo(t.home)}<span class="teamname">${esc(t.home?.name||'—')}</span><b class="score">${g.home??'—'}</b></div><div class="teamline">${logo(t.away)}<span class="teamname">${esc(t.away?.name||'—')}</span><b class="score">${g.away??'—'}</b></div></div><div class="mact"><svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div></article>`}
function renderFixtures(){const q=state.query.trim().toLowerCase();let list=state.fixtures.filter(x=>state.filter==='all'||fixtureState(x)===state.filter);if(q)list=list.filter(x=>`${x.teams?.home?.name||''} ${x.teams?.away?.name||''} ${x.league?.name||''}`.toLowerCase().includes(q));if(!list.length){$('#content').innerHTML='<div class="empty">На выбранную дату матчей нет</div>';return}
const fixturePriority=x=>{const s=fixtureState(x);if(s==='live')return 0;if(s==='upcoming')return 1;return 2};

function historyTeamCard(label,team,data){const items=(data?.last||[]).slice(0,10);const stats=items.reduce((acc,m)=>{const x=outcomeInfo(m,team.id); if(x.cls==='win')acc.w++; else if(x.cls==='draw')acc.d++; else if(x.cls==='lose')acc.l++; return acc;},{w:0,d:0,l:0});return `<section class="historyteamcard pretty"><div class="historyhead">${logo(team,'teamlogo')}<div><b>${esc(team.name||label)}</b><small>${esc(label)} · последние 10 матчей</small></div></div><div class="historysummary"><div><small>Победы</small><b>${stats.w}</b></div><div><small>Ничьи</small><b>${stats.d}</b></div><div><small>Поражения</small><b>${stats.l}</b></div></div>${items.length?`<div class="historyrows pretty">${items.map(x=>historyRow(x,team.id)).join('')}</div>`:'<div class="emptycard">Последние матчи пока недоступны</div>'}</section>`}
function tableStyledHtml(rows,leagueId,season,selectedIds){if(!rows.length)return '<section class="section tablecard"><div class="tabletitle"><h3>Турнирная таблица</h3></div><div class="emptycard">Таблица пока недоступна</div></section>';return `<section class="section tablecard"><div class="tabletitle"><h3>Турнирная таблица</h3><small>текущая позиция команд</small></div><div class="tablewrap"><table class="standing"><thead><tr><th>#</th><th>Команда</th><th>И</th><th>РМ</th><th>Форма</th><th style="text-align:right">О</th></tr></thead><tbody>${rows.map(r=>`<tr class="${(selectedIds||[]).includes(Number(r.team?.id||0))?'mine':''}"><td class="rank">${r.rank??'—'}</td><td class="teamcell">${r.team?.logo?`<img src="${esc(r.team.logo)}" alt="">`:''}<span>${esc(r.team?.name||'—')}</span></td><td>${r.all?.played??'—'}</td><td>${r.goalsDiff??'—'}</td><td class="formcell">${esc(r.form||'—')}</td><td class="pts">${r.points??'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
async function matchesTabHtml(){const t=state.selected.teams||{},l=state.selected.league||{};const [homeData,awayData]=await Promise.all([api(`/api-football/team-profile?team=${Number(t.home?.id||0)}&league=${Number(l.id||0)}&season=${Number(l.season||0)}`),api(`/api-football/team-profile?team=${Number(t.away?.id||0)}&league=${Number(l.id||0)}&season=${Number(l.season||0)}`)]);updateQuota(homeData);updateQuota(awayData);rememberFixtures([...(homeData.last||[]),...(awayData.last||[])]);return `<section class="section compact"><h3>Последние 10 матчей <span>${esc(l.name||'')}</span></h3><div class="historysplit">${historyTeamCard('хозяева',t.home||{},homeData)}${historyTeamCard('гости',t.away||{},awayData)}</div></section>`}
async function tableTabHtml(){const l=state.selected.league||{},t=state.selected.teams||{};if(!(l.id&&l.season))return '<div class="empty">Для этого матча таблица недоступна</div>';const d=await api(`/api-football/league-view?league=${Number(l.id)}&season=${Number(l.season)}`);updateQuota(d);return tableStyledHtml(d.standings||[],Number(l.id),Number(l.season),[Number(t.home?.id||0),Number(t.away?.id||0)])}


function playerMetric(label,value,note=''){return `<div class="playermetric"><small>${esc(label)}</small><b>${esc(val(value))}</b>${note?`<em>${esc(note)}</em>`:''}</div>`}
function competitionCard(s){const l=s?.league||{},g=s?.games||{},go=s?.goals||{};return `<article class="competitioncard"><div class="competitionhead">${l.logo?`<img src="${esc(l.logo)}" alt="">`:''}<div><b>${esc(l.name||'Турнир')}</b><small>${esc(l.country||'')} · сезон ${esc(l.season||state.selected?.league?.season||'—')}</small></div></div><div class="competitionnumbers"><div><small>Матчи</small><b>${val(g.appearences)}</b></div><div><small>Минуты</small><b>${val(g.minutes)}</b></div><div><small>Голы</small><b>${val(go.total)}</b></div><div><small>Ассисты</small><b>${val(go.assists)}</b></div></div></article>`}
function matchPlayerStatsHtml(m){if(!m?.statistics)return'';const s=m.statistics,g=s.games||{},go=s.goals||{},sh=s.shots||{},pa=s.passes||{};return `<section class="section"><h3>Статистика в этом матче <span>${esc(state.selected?.teams?.home?.name||'')} — ${esc(state.selected?.teams?.away?.name||'')}</span></h3><div class="matchrating">${playerMetric('Минуты',g.minutes)}${playerMetric('Оценка',g.rating)}${playerMetric('Голы',go.total)}${playerMetric('Ассисты',go.assists)}${playerMetric('Удары',sh.total)}${playerMetric('В створ',sh.on)}${playerMetric('Передачи',pa.total)}${playerMetric('Точность',pa.accuracy)}</div></section>`}
function seasonPlayerStatsHtml(stats){if(!stats)return'<section class="section"><h3>Статистика сезона</h3><div class="emptycard">API-Football не вернул статистику игрока для этого сезона</div></section>';const g=stats.games||{},go=stats.goals||{},sh=stats.shots||{},pa=stats.passes||{},ta=stats.tackles||{},du=stats.duels||{},dr=stats.dribbles||{},ca=stats.cards||{},fo=stats.fouls||{};return `<section class="section"><h3>Статистика сезона <span>${esc(stats.league?.name||'')}</span></h3><div class="metricgrid">${playerMetric('Матчи',g.appearences)}${playerMetric('В старте',g.lineups)}${playerMetric('Минуты',g.minutes)}${playerMetric('Оценка',g.rating)}${playerMetric('Голы',go.total)}${playerMetric('Ассисты',go.assists)}${playerMetric('Удары',sh.total)}${playerMetric('В створ',sh.on)}${playerMetric('Передачи',pa.total)}${playerMetric('Ключевые',pa.key)}${playerMetric('Точность паса',pa.accuracy,'%')}${playerMetric('Отборы',ta.total)}${playerMetric('Перехваты',ta.interceptions)}${playerMetric('Дуэли выиграны',du.won)}${playerMetric('Успешный дриблинг',dr.success)}${playerMetric('Фолы на игроке',fo.drawn)}${playerMetric('Жёлтые',ca.yellow)}${playerMetric('Красные',ca.red)}</div></section>`}
async function openPlayer(id,name='',teamId=0){if(!id)return;state.selectedPlayer={id,name,teamId};const overlay=$('#playerDetail'),body=$('#playerBody');overlay.classList.remove('hidden');document.body.style.overflow='hidden';const seed={id:Number(id),name:name||'Игрок',photo:`https://media.api-sports.io/football/players/${Number(id)}.png`};body.innerHTML=`<div class="playerprofilehero">${playerPhoto(seed,'playerhero-photo')}<h2>${esc(seed.name)}</h2><p>Загружаю профиль и статистику…</p></div><div class="loading"><i></i>Получаю данные игрока</div>`;try{const season=Number(state.selected?.league?.season||new Date().getFullYear()),fixture=Number(state.selected?.fixture?.id||0),query=`player=${Number(id)}&season=${season}${fixture?`&fixture=${fixture}`:''}${teamId?`&team=${Number(teamId)}`:''}`,d=await api(`/api-football/player-profile?${query}`);updateQuota(d);const profile=d.profile||{},player=profile.player||seed,allStats=profile.statistics||[],leagueId=Number(state.selected?.league?.id||0);const primary=allStats.find(s=>Number(s.league?.id||0)===leagueId&&(!teamId||Number(s.team?.id||0)===Number(teamId)))||allStats.find(s=>Number(s.team?.id||0)===Number(teamId))||allStats[0]||null;const club=primary?.team||d.match?.team||{};body.innerHTML=`<div class="playerprofilehero">${playerPhoto(player,'playerhero-photo')}<h2>${esc(player.name||name||'Игрок')}</h2><p>${esc(posName(primary?.games?.position||d.match?.statistics?.games?.position))} · ${esc(player.nationality||'Национальность не указана')}</p><div class="playerstatus ${player.injured?'injured':''}">${player.injured?'ТРАВМИРОВАН':'ДОСТУПЕН'}</div>${club?.name?`<div class="playerclubline">${club.logo?`<img src="${esc(club.logo)}" alt="">`:''}<span>${esc(club.name)}</span></div>`:''}</div><div class="dbody"><section class="section"><h3>Информация об игроке</h3><div class="player-info-grid"><div><small>Возраст</small><b>${esc(val(player.age))}</b></div><div><small>Дата рождения</small><b>${esc(val(player.birth?.date))}</b></div><div><small>Рост</small><b>${esc(val(player.height))}</b></div><div><small>Вес</small><b>${esc(val(player.weight))}</b></div><div><small>Место рождения</small><b>${esc(val(player.birth?.place))}</b></div><div><small>Гражданство</small><b>${esc(val(player.nationality))}</b></div></div></section>${matchPlayerStatsHtml(d.match)}${seasonPlayerStatsHtml(primary)}${allStats.length>1?`<section class="section"><h3>Все турниры сезона <span>${allStats.length}</span></h3><div class="competitionstats">${allStats.slice(0,8).map(competitionCard).join('')}</div></section>`:''}</div>`}catch(e){body.innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function closePlayer(){const overlay=$('#playerDetail');overlay.classList.add('hidden');document.body.style.overflow=$('#detail').classList.contains('hidden')?'':'hidden'}

function splitValue(obj,key,side){return obj?.[key]?.[side]??'—'}
function formHtml(form){const letters=String(form||'').slice(-10).split('');if(!letters.length)return'<div class="empty">Форма пока недоступна</div>';return `<div class="formrow">${letters.map(x=>`<span class="formbadge ${String(x).toLowerCase()}">${esc(x)}</span>`).join('')}</div>`}
function teamStatisticsHtml(d){const s=d.statistics||{},f=s.fixtures||{},gf=s.goals?.for||{},ga=s.goals?.against||{},standing=d.standing||{},league=s.league||{};if(!d.statistics)return `<section class="section"><h3>Статистика команды</h3><div class="team-stat-note">Для выбранной лиги и сезона API-Football не вернул командную статистику. Матчи клуба ниже всё равно доступны.</div></section>`;return `<section class="section"><div class="teamstats-head">${league.logo?`<img src="${esc(league.logo)}" alt="">`:''}<div><b>${esc(league.name||'Статистика сезона')}</b><small>${esc(league.country||'')} · сезон ${esc(league.season||d.context?.season||'—')}</small></div></div><div class="positioncard"><div><small>Место</small><b>${standing.rank??'—'}</b></div><div><small>Очки</small><b>${standing.points??'—'}</b></div><div><small>Разница голов</small><b>${standing.goalsDiff??'—'}</b></div></div></section><section class="section"><h3>Текущая форма <span>последние матчи</span></h3>${formHtml(s.form||standing.form)}</section><section class="section"><h3>Результаты сезона</h3><div class="quick"><div><small>Матчи</small><b>${f.played?.total??'—'}</b></div><div><small>Победы</small><b>${f.wins?.total??'—'}</b></div><div><small>Ничьи</small><b>${f.draws?.total??'—'}</b></div></div><div class="teammetric-grid" style="margin-top:7px"><div class="teammetric"><small>Поражения</small><b>${f.loses?.total??'—'}</b><em>за сезон</em></div><div class="teammetric"><small>Сухие матчи</small><b>${s.clean_sheet?.total??'—'}</b><em>без пропущенных</em></div><div class="teammetric"><small>Забито голов</small><b>${gf.total?.total??'—'}</b><em>в среднем ${gf.average?.total??'—'}</em></div><div class="teammetric"><small>Пропущено голов</small><b>${ga.total?.total??'—'}</b><em>в среднем ${ga.average?.total??'—'}</em></div><div class="teammetric"><small>Не забила</small><b>${s.failed_to_score?.total??'—'}</b><em>матчей</em></div><div class="teammetric"><small>Серия побед</small><b>${s.biggest?.streak?.wins??'—'}</b><em>максимальная</em></div></div></section><section class="section"><h3>Дома и в гостях</h3><table class="split-table"><thead><tr><th>Показатель</th><th>Дома</th><th>В гостях</th><th>Всего</th></tr></thead><tbody><tr><td>Матчи</td><td>${splitValue(f,'played','home')}</td><td>${splitValue(f,'played','away')}</td><td>${splitValue(f,'played','total')}</td></tr><tr><td>Победы</td><td>${splitValue(f,'wins','home')}</td><td>${splitValue(f,'wins','away')}</td><td>${splitValue(f,'wins','total')}</td></tr><tr><td>Ничьи</td><td>${splitValue(f,'draws','home')}</td><td>${splitValue(f,'draws','away')}</td><td>${splitValue(f,'draws','total')}</td></tr><tr><td>Поражения</td><td>${splitValue(f,'loses','home')}</td><td>${splitValue(f,'loses','away')}</td><td>${splitValue(f,'loses','total')}</td></tr><tr><td>Забито</td><td>${gf.total?.home??'—'}</td><td>${gf.total?.away??'—'}</td><td>${gf.total?.total??'—'}</td></tr><tr><td>Пропущено</td><td>${ga.total?.home??'—'}</td><td>${ga.total?.away??'—'}</td><td>${ga.total?.total??'—'}</td></tr></tbody></table></section>`}
async function openTeam(id,league=0,season=0){if(!id)return;const seed=state['team_'+id]||{};$('#teamDetail').classList.remove('hidden');document.body.style.overflow='hidden';$('#teamBody').innerHTML=`<div class="profilehero">${logo(seed.team||{},'bigfallback')}<h2>${esc(seed.team?.name||'Клуб')}</h2><p>${esc(seed.team?.country||'')}</p></div><div class="loading"><i></i>Загружаю статистику клуба…</div>`;try{const query=`team=${id}${league?`&league=${league}`:''}${season?`&season=${season}`:''}`,d=await api(`/api-football/team-profile?${query}`);updateQuota(d);state.teamProfile=d;const item=d.team||seed,t=item.team||{},v=item.venue||{};rememberFixtures([...(d.last||[]),...(d.next||[])]);state['team_'+id]=item;$('#teamBody').innerHTML=`<div class="profilehero">${logo(t,'bigfallback')}<h2>${esc(t.name||'Клуб')}</h2><p>${esc(t.country||'')}${v.city?` · ${esc(v.city)}`:''}${t.founded?` · с ${esc(t.founded)} года`:''}</p></div><div class="dbody"><section class="section"><h3>Информация</h3><div class="quick"><div><small>Страна</small><b>${esc(t.country||'—')}</b></div><div><small>Код</small><b>${esc(t.code||'—')}</b></div><div><small>Стадион</small><b>${esc(v.name||'—')}</b></div></div></section>${teamStatisticsHtml(d)}${fixtureSection('Ближайшие матчи',d.next||[])}${fixtureSection('Последние матчи',d.last||[])}</div>`}catch(e){$('#teamBody').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function fixtureSection(title,items){if(!items.length)return`<section class="section"><h3>${esc(title)}</h3><div class="empty">Данных пока нет</div></section>`;return `<section class="section"><h3>${esc(title)}</h3><div class="matches">${items.map(matchRow).join('')}</div></section>`}
async function openLeague(id,season){const seed=state['league_'+id]||{},l=seed.league||{},c=seed.country||{};$('#leagueDetail').classList.remove('hidden');document.body.style.overflow='hidden';$('#leagueBody').innerHTML=`<div class="profilehero">${l.logo?`<img src="${esc(l.logo)}" alt="">`:''}<h2>${esc(l.name||'Лига')}</h2><p>${esc(c.name||'')} · сезон ${season}</p></div><div class="loading"><i></i>Загружаю лигу…</div>`;try{const d=await api(`/api-football/league-view?league=${id}&season=${season}`);updateQuota(d);state.leagueView=d;const item=d.league||seed,lg=item?.league||l,ct=item?.country||c;rememberFixtures(d.next||[]);$('#leagueBody').innerHTML=`<div class="profilehero">${lg.logo?`<img src="${esc(lg.logo)}" alt="">`:''}<h2>${esc(lg.name||'Лига')}</h2><p>${esc(ct.name||'')} · сезон ${esc(d.season||season)}</p></div><div class="dbody">${standingsHtml(d.standings||[])}${fixtureSection('Ближайшие матчи',d.next||[])}</div>`}catch(e){$('#leagueBody').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function standingsHtml(rows){return tableStyledHtml(rows,Number(state.leagueView?.league?.league?.id||state.leagueView?.league?.id||0),Number(state.leagueView?.season||0),[])}
function openNotify(){const host=$('#notifyHost'),frame=$('#notifyFrame');host.classList.remove('hidden');document.body.style.overflow='hidden';if(!frame.src){const suffix=(location.search||'')+(location.hash||'');frame.src='/notify/'+suffix}history.pushState({notify:true},'',location.href)}
function closeNotify(){const host=$('#notifyHost');host.classList.add('hidden');document.body.style.overflow=''}
$('#searchToggle').onclick=()=>{$('#searchrow').classList.toggle('hidden');if(!$('#searchrow').classList.contains('hidden'))setTimeout(()=>$('#searchInput').focus(),50)};
$('#searchInput').oninput=onSearchInput;$('#searchClear').onclick=clearSearch;
$('#navMatches').onclick=showMatches;$('#navLeagues').onclick=()=>{clearSearch();loadLeagues()};$('#openNotify').onclick=openNotify;$('#backMatches').onclick=closeNotify;
$$('.seg').forEach((b,i)=>b.onclick=()=>{state.filter=b.dataset.filter;$$('.seg').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#indicator').style.transform=`translateX(${i*100}%)`;renderFixtures()});
$('#closeDetail').onclick=()=>closeOverlay('#detail');$('#closeTeam').onclick=()=>closeOverlay('#teamDetail');$('#closeLeague').onclick=()=>closeOverlay('#leagueDetail');$('#closePlayer').onclick=closePlayer;$('#detailRefresh').onclick=()=>loadDetailTab(state.tab,true);$$('.tab').forEach(b=>b.onclick=()=>loadDetailTab(b.dataset.tab));
window.onpopstate=()=>{if(!$('#notifyHost').classList.contains('hidden'))closeNotify();else if(!$('#playerDetail').classList.contains('hidden'))closePlayer();else if(!$('#teamDetail').classList.contains('hidden'))closeOverlay('#teamDetail');else if(!$('#leagueDetail').classList.contains('hidden'))closeOverlay('#leagueDetail');else if(!$('#detail').classList.contains('hidden'))closeOverlay('#detail')};
buildDates();setViewUI();loadFixtures();setInterval(()=>{if(state.view==='matches'&&state.date===ymd(new Date())&&document.visibilityState==='visible'&&$('#detail').classList.contains('hidden')&&$('#teamDetail').classList.contains('hidden')&&$('#leagueDetail').classList.contains('hidden')&&$('#notifyHost').classList.contains('hidden')&&!state.query)loadFixtures()},60000);
</script>
