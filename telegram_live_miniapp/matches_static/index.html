function bindLiveNotifyFrame(frame){
  if(!frame)return;
  const enableScroll=()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      doc.documentElement.style.overflowX='hidden';
      doc.documentElement.style.overflowY='auto';
      doc.documentElement.style.height='100%';
      doc.body.style.overflowX='hidden';
      doc.body.style.overflowY='auto';
      doc.body.style.height='100%';
      doc.body.style.webkitOverflowScrolling='touch';
      doc.body.style.touchAction='pan-y';
    }catch(e){}
  };
  frame.addEventListener('load',()=>{
    enableScroll();
    setTimeout(enableScroll,80);
    setTimeout(enableScroll,350);
    setTimeout(enableScroll,1000);
  });
}

const fixturePriority=x=>{const s=fixtureState(x);if(s==='live')return 0;if(s==='upcoming')return 1;return 2};
list.sort((a,b)=>{const pa=fixturePriority(a),pb=fixturePriority(b);if(pa!==pb)return pa-pb; if(pa===0)return Number(b.fixture?.status?.elapsed||0)-Number(a.fixture?.status?.elapsed||0); const ta=(new Date(a.fixture?.date||0)).getTime(),tb=(new Date(b.fixture?.date||0)).getTime(); return pa===1?ta-tb:tb-ta});
const groups=new Map();for(const x of list){const l=x.league||{},key=`${l.id||0}|${l.country||'Мир'}|${l.name||'Лига'}|${l.logo||''}|${l.flag||''}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}
const sections=[...groups].map(([key,items])=>{const[,country,name,llogo,flag]=key.split('|'); const hasLive=items.some(m=>fixtureState(m)==='live'); const hasUpcoming=items.some(m=>fixtureState(m)==='upcoming'); const pri=hasLive?0:(hasUpcoming?1:2); return {pri, html:`<section class="league ${hasLive?'league-live':''}"><div class="leaguehead">${llogo?`<img src="${esc(llogo)}" alt="">`:(flag?`<img src="${esc(flag)}" alt="">`:'<span class="flag">⚽</span>')}<b>${esc(country.toUpperCase())} — ${esc(name.toUpperCase())}</b>${hasLive?'<span class="leaguebadge">LIVE</span>':''}</div><div class="matches">${items.map(matchRow).join('')}</div></section>`}}).sort((a,b)=>a.pri-b.pri);

async function loadFixtures(force=false){if(state.loading)return;state.loading=true;$('#content').innerHTML='<div class="loading"><i></i>Загружаю матчи…</div>';try{const d=await api(`/api-football/fixtures?date=${encodeURIComponent(state.date)}&timezone=Europe%2FMoscow${force?'&force=1':''}`);state.fixtures=d.response||[];rememberFixtures(state.fixtures);updateQuota(d);renderFixtures()}catch(e){$('#content').innerHTML=`<div class="errorbox"><b>Не удалось загрузить матчи</b><br>${esc(e.message)}</div>`}finally{state.loading=false}}
function commonAlias(q){const x=q.trim().toLowerCase();const a={'реал':'Real Madrid','реал мадрид':'Real Madrid','барселона':'Barcelona','арсенал':'Arsenal','челси':'Chelsea','ливерпуль':'Liverpool','манчестер сити':'Manchester City','ман сити':'Manchester City','манчестер юнайтед':'Manchester United','ман юнайтед':'Manchester United','бавария':'Bayern Munich','боруссия дортмунд':'Borussia Dortmund','интер':'Inter','милан':'AC Milan','ювентус':'Juventus','псж':'Paris Saint Germain'};if(a[x])return a[x];const map={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ы':'y','э':'e','ю':'yu','я':'ya','ь':'','ъ':''};return /[а-яё]/i.test(x)?x.split('').map(c=>map[c]??c).join(''):q.trim()}
function onSearchInput(){const q=$('#searchInput').value.trim();state.query=q;$('#searchClear').classList.toggle('hidden',!q);if(state.view==='leagues'){renderLeagues();return}clearTimeout(state.teamTimer);if(!q){renderFixtures();return}if(q.length<3){$('#content').innerHTML='<div class="hint"><b>Поиск любого клуба</b><br>Введите минимум 3 буквы. Можно писать по-русски или по-английски.</div>';return}state.teamTimer=setTimeout(()=>searchTeams(q),350)}

function eventIcon(type,detail){const t=String(type||'').toLowerCase(),d=String(detail||'').toLowerCase();if(t==='goal')return d.includes('missed')?'❌':'⚽';if(t==='card')return d.includes('red')?'🟥':'🟨';if(t==='subst'||t==='substitution')return'🔄';if(t==='var')return'📺';return'•'}

function countsAsGoal(e){const t=String(e?.type||'').toLowerCase(),d=String(e?.detail||'').toLowerCase();if(t!=='goal')return false;return !(d.includes('missed')||d.includes('cancelled')||d.includes('canceled'))}
function timelineData(items){const homeId=Number(state.selected?.teams?.home?.id||0),awayId=Number(state.selected?.teams?.away?.id||0);const asc=[...(items||[])].sort((a,b)=>eventSortKey(a)-eventSortKey(b));let h=0,a=0,ht={h:0,a:0};for(const e of asc){if(countsAsGoal(e)){const tid=Number(e?.team?.id||0);if(tid===homeId)h++;else if(tid===awayId)a++;e._score=`${h}-${a}`;}if(Number(e?.time?.elapsed||0)<=45){ht={h,a}}}return {items:asc.reverse(),half:ht,final:{h,a}}}

async function trendsHtml(force=false){const t=state.selected?.teams||{};if(!(t.home?.id&&t.away?.id))return'<div class="trend-empty">Не удалось определить команды матча</div>';const suffix=force?'&force=1':'';const d=await api(`/api-football/trends?home=${Number(t.home.id)}&away=${Number(t.away.id)}&home_name=${encodeURIComponent(t.home.name||'Хозяева')}&away_name=${encodeURIComponent(t.away.name||'Гости')}${suffix}`);updateQuota(d);const groups=Array.isArray(d.groups)?d.groups:[];if(!groups.length)return'<div class="trend-empty">Тренды пока недоступны<button class="trend-retry" onclick="loadDetailTab(\'trends\',true)">Проверить ещё раз</button></div>';return `<div class="trend-loading-note">Тренды рассчитаны по последним матчам команд. Коэффициенты здесь не используются.</div>${groups.map((group,index)=>`<section class="section trendbox ${trendClass(index,group?.title)}"><div class="trendhead"><h3>${esc(group?.title||'Тренды')} <span>(${(group?.items||[]).length})</span></h3></div>${(group?.items||[]).map(item=>trendItemHtml(item,index,t,group?.title)).join('')}</section>`).join('')}`}

function tableStyledHtml(rows,leagueId,season,selectedIds){if(!rows.length)return '<section class="section tablecard"><div class="tabletitle"><h3>Турнирная таблица</h3></div><div class="emptycard">Таблица пока недоступна</div></section>';return `<section class="section tablecard"><div class="tabletitle"><h3>Турнирная таблица</h3><small>текущая позиция команд</small></div><div class="tablewrap"><table class="standing"><thead><tr><th>#</th><th>Команда</th><th>И</th><th>ЗМ</th><th>ПМ</th><th>РМ</th><th>Форма</th><th style="text-align:right">О</th></tr></thead><tbody>${rows.map(r=>`<tr class="${(selectedIds||[]).includes(Number(r.team?.id||0))?'mine':''}"><td class="rank">${r.rank??'—'}</td><td class="teamcell">${r.team?.logo?`<img src="${esc(r.team.logo)}" alt="">`:''}<span>${esc(r.team?.name||'—')}</span></td><td>${r.all?.played??'—'}</td><td>${r.all?.goals?.for??r.for??'—'}</td><td>${r.all?.goals?.against??r.against??'—'}</td><td>${r.goalsDiff??'—'}</td><td class="formcell">${esc(r.form||'—')}</td><td class="pts">${r.points??'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
async function matchesTabHtml(){const t=state.selected.teams||{},l=state.selected.league||{};const mode=state.matchSwitch||'h2h';let body='';if(mode==='home'||mode==='away'){const team=mode==='home'?(t.home||{}):(t.away||{});const data=await api(`/api-football/team-profile?team=${Number(team.id||0)}&league=${Number(l.id||0)}&season=${Number(l.season||0)}`);updateQuota(data);rememberFixtures([...(data.last||[])]);body=historyTeamCard(mode==='home'?'хозяева':'гости',team,data)}else{const d=await api(`/api-football/h2h?home=${Number(t.home?.id||0)}&away=${Number(t.away?.id||0)}&last=10`);updateQuota(d);const items=d.response||[];rememberFixtures(items);body=`<section class="historyteamcard showcase"><div class="historyhead"><div><b>${esc(t.home?.name||'')} — ${esc(t.away?.name||'')}</b><small>личные встречи</small></div></div>${h2hCardsHtml(items)}</section>`}return `<section class="section compact"><h3 class="matches-title">Последние матчи <span>${esc(l.name||'')}</span></h3>${matchSwitcherHtml()}<div class="matches-showcase single">${body}</div></section>`}
async function tableTabHtml(){const l=state.selected.league||{},t=state.selected.teams||{};if(!(l.id&&l.season))return '<div class="empty">Для этого матча таблица недоступна</div>';const d=await api(`/api-football/league-view?league=${Number(l.id)}&season=${Number(l.season)}`);updateQuota(d);return tableStyledHtml(d.standings||[],Number(l.id),Number(l.season),[Number(t.home?.id||0),Number(t.away?.id||0)])}


function playerMetric(label,value,note=''){return `<div class="playermetric"><small>${esc(label)}</small><b>${esc(val(value))}</b>${note?`<em>${esc(note)}</em>`:''}</div>`}
function competitionCard(s){const l=s?.league||{},g=s?.games||{},go=s?.goals||{};return `<article class="competitioncard"><div class="competitionhead">${l.logo?`<img src="${esc(l.logo)}" alt="">`:''}<div><b>${esc(l.name||'Турнир')}</b><small>${esc(l.country||'')} · сезон ${esc(l.season||state.selected?.league?.season||'—')}</small></div></div><div class="competitionnumbers"><div><small>Матчи</small><b>${val(g.appearences)}</b></div><div><small>Минуты</small><b>${val(g.minutes)}</b></div><div><small>Голы</small><b>${val(go.total)}</b></div><div><small>Ассисты</small><b>${val(go.assists)}</b></div></div></article>`}
function matchPlayerStatsHtml(m){if(!m?.statistics)return'';const s=m.statistics,g=s.games||{},go=s.goals||{},sh=s.shots||{},pa=s.passes||{};return `<section class="section"><h3>Статистика в этом матче <span>${esc(state.selected?.teams?.home?.name||'')} — ${esc(state.selected?.teams?.away?.name||'')}</span></h3><div class="matchrating">${playerMetric('Минуты',g.minutes)}${playerMetric('Оценка',g.rating)}${playerMetric('Голы',go.total)}${playerMetric('Ассисты',go.assists)}${playerMetric('Удары',sh.total)}${playerMetric('В створ',sh.on)}${playerMetric('Передачи',pa.total)}${playerMetric('Точность',pa.accuracy)}</div></section>`}

function playerCurrentClubHtml(d,primary,club){const squad=d.current_squad?.player||{},team=d.current_squad?.team||club||primary?.team||{};const games=primary?.games||{};return `<section class="section"><h3>Текущая команда <span>состав клуба</span></h3><div class="current-club-card">${logo(team,'teamlogo')}<div><b>${esc(team.name||'Команда не определена')}</b><small>${esc(posName(squad.position||games.position))}${squad.number||games.number?` · № ${esc(squad.number??games.number)}`:''}</small></div></div><div class="current-club-meta"><div><small>Позиция</small><b>${esc(posName(squad.position||games.position))}</b></div><div><small>Номер</small><b>${esc(val(squad.number??games.number))}</b></div><div><small>Капитан</small><b>${games.captain?'Да':'Нет'}</b></div></div></section>`}
function playerRankingsHtml(rankings){const data=[['Бомбардиры',rankings?.topscorers],['Ассистенты',rankings?.topassists],['Жёлтые карточки',rankings?.topyellowcards],['Красные карточки',rankings?.topredcards]];return `<section class="section"><h3>Место в рейтингах лиги <span>топ-20</span></h3><div class="player-rank-grid">${data.map(([label,rank])=>`<div class="player-rank ${rank?'':'out'}"><small>${label}</small><b>${rank?`№ ${rank}`:'Вне топ-20'}</b></div>`).join('')}</div></section>`}
function playerCareerHtml(teams,seasons){const items=Array.isArray(teams)?teams:[];return `<section class="section"><h3>Карьера по клубам и сезонам</h3>${items.length?`<div class="player-career-list">${items.map(item=>{const team=item.team||{},years=(item.seasons||[]).sort((a,b)=>a-b);return `<div class="player-career-row">${logo(team,'teamlogo')}<div><b>${esc(team.name||'—')}</b><small>${years.length?years.join(', '):'Сезоны не указаны'}</small></div></div>`}).join('')}</div>`:'<div class="player-empty-note">История клубов пока недоступна.</div>'}${Array.isArray(seasons)&&seasons.length?`<div class="player-seasons" style="margin-top:9px">${seasons.slice().sort((a,b)=>b-a).slice(0,20).map(year=>`<span class="player-season-chip">${esc(year)}</span>`).join('')}</div>`:''}</section>`}
function playerAbsencesHtml(injuries,sidelined){const current=(injuries||[]).map(x=>({current:true,type:x.type||x.reason||'Травма / дисквалификация',reason:x.reason||'',start:x.fixture?.date||'',end:'',team:x.team?.name||''}));const history=(sidelined||[]).map(x=>({current:false,type:x.type||'Отсутствие',reason:'',start:x.start||'',end:x.end||'',team:''}));const items=[...current,...history];return `<section class="section"><h3>Травмы и периоды отсутствия</h3>${items.length?`<div class="player-absence-list">${items.slice(0,12).map(x=>`<div class="player-absence ${x.current?'current':''}"><b>${esc(x.type)}</b><small>${x.current?'Текущая запись':`${esc(x.start||'—')} — ${esc(x.end||'по настоящее время')}`}${x.reason?` · ${esc(x.reason)}`:''}${x.team?` · ${esc(x.team)}`:''}</small></div>`).join('')}</div>`:'<div class="player-empty-note">Данных о травмах и пропусках нет.</div>'}</section>`}
function flattenPlayerTransfers(data){const out=[];for(const item of (data||[])){for(const transfer of (item.transfers||[])){out.push({date:transfer.date||item.update||'',type:transfer.type||'',teams:transfer.teams||{}})}}return out.sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function playerTransfersHtml(data){const items=flattenPlayerTransfers(data);return `<section class="section"><h3>Переходы между клубами</h3>${items.length?`<div class="player-transfer-list">${items.slice(0,15).map(x=>`<div class="player-transfer"><div class="player-transfer-head"><b>Переход</b><small>${esc(x.date||'')}</small></div><div class="player-transfer-flow"><div class="player-transfer-team">${logo(x.teams?.out||{},'tinylogo')}<span>${esc(x.teams?.out?.name||'—')}</span></div><div class="player-transfer-arrow">→</div><div class="player-transfer-team">${logo(x.teams?.in||{},'tinylogo')}<span>${esc(x.teams?.in?.name||'—')}</span></div></div>${x.type?`<div class="player-transfer-type">${esc(x.type)}</div>`:''}</div>`).join('')}</div>`:'<div class="player-empty-note">История переходов пока недоступна.</div>'}</section>`}
function trophyPlaceRu(place){const p=String(place||'');if(p==='Winner')return'Победитель';if(p==='Runner-up')return'Финалист';if(p==='3rd Place')return'3-е место';return p||'Трофей'}
function playerTrophiesHtml(items){return `<section class="section"><h3>Трофеи игрока</h3>${(items||[]).length?`<div class="player-trophy-list">${items.slice(0,20).map(x=>`<div class="player-trophy"><div class="player-trophy-icon">🏆</div><div><b>${esc(x.league||'Турнир')}</b><small>${esc(x.country||'')} · ${esc(x.season||'')}</small></div><div class="player-trophy-place">${esc(trophyPlaceRu(x.place))}</div></div>`).join('')}</div>`:'<div class="player-empty-note">Трофеи пока не найдены.</div>'}</section>`}

function seasonPlayerStatsHtml(stats){if(!stats)return'<section class="section"><h3>Статистика сезона</h3><div class="emptycard">API-Football не вернул статистику игрока для этого сезона</div></section>';const g=stats.games||{},go=stats.goals||{},sh=stats.shots||{},pa=stats.passes||{},ta=stats.tackles||{},du=stats.duels||{},dr=stats.dribbles||{},ca=stats.cards||{},fo=stats.fouls||{};return `<section class="section"><h3>Статистика сезона <span>${esc(stats.league?.name||'')}</span></h3><div class="metricgrid">${playerMetric('Матчи',g.appearences)}${playerMetric('В старте',g.lineups)}${playerMetric('Минуты',g.minutes)}${playerMetric('Оценка',g.rating)}${playerMetric('Голы',go.total)}${playerMetric('Ассисты',go.assists)}${playerMetric('Удары',sh.total)}${playerMetric('В створ',sh.on)}${playerMetric('Передачи',pa.total)}${playerMetric('Ключевые',pa.key)}${playerMetric('Точность паса',pa.accuracy,'%')}${playerMetric('Отборы',ta.total)}${playerMetric('Перехваты',ta.interceptions)}${playerMetric('Дуэли выиграны',du.won)}${playerMetric('Успешный дриблинг',dr.success)}${playerMetric('Фолы на игроке',fo.drawn)}${playerMetric('Жёлтые',ca.yellow)}${playerMetric('Красные',ca.red)}</div></section>`}
async function openPlayer(id,name='',teamId=0){if(!id)return;state.selectedPlayer={id,name,teamId};const overlay=$('#playerDetail'),body=$('#playerBody');overlay.classList.remove('hidden');document.body.style.overflow='hidden';const seed={id:Number(id),name:name||'Игрок',photo:`https://media.api-sports.io/football/players/${Number(id)}.png`};body.innerHTML=`<div class="playerprofilehero">${playerPhoto(seed,'playerhero-photo')}<h2>${esc(seed.name)}</h2><p>Загружаю профиль и статистику…</p></div><div class="loading"><i></i>Получаю данные игрока</div>`;try{const season=Number(state.selected?.league?.season||new Date().getFullYear()),fixture=Number(state.selected?.fixture?.id||0),league=Number(state.selected?.league?.id||0),query=`player=${Number(id)}&season=${season}${fixture?`&fixture=${fixture}`:''}${teamId?`&team=${Number(teamId)}`:''}${league?`&league=${league}`:''}`,d=await api(`/api-football/player-profile?${query}`);updateQuota(d);const profile=d.profile||{},player=profile.player||seed,allStats=profile.statistics||[],leagueId=Number(state.selected?.league?.id||0);const primary=allStats.find(s=>Number(s.league?.id||0)===leagueId&&(!teamId||Number(s.team?.id||0)===Number(teamId)))||allStats.find(s=>Number(s.team?.id||0)===Number(teamId))||allStats[0]||null;const club=d.current_squad?.team||primary?.team||d.match?.team||{};body.innerHTML=`<div class="playerprofilehero">${playerPhoto(player,'playerhero-photo')}<h2>${esc(player.name||name||'Игрок')}</h2><p>${esc(posName(primary?.games?.position||d.match?.statistics?.games?.position))} · ${esc(player.nationality||'Национальность не указана')}</p><div class="playerstatus ${player.injured?'injured':''}">${player.injured?'ТРАВМИРОВАН':'ДОСТУПЕН'}</div>${club?.name?`<div class="playerclubline">${club.logo?`<img src="${esc(club.logo)}" alt="">`:''}<span>${esc(club.name)}</span></div>`:''}</div><div class="dbody"><section class="section"><h3>Информация об игроке</h3><div class="player-info-grid"><div><small>Возраст</small><b>${esc(val(player.age))}</b></div><div><small>Дата рождения</small><b>${esc(val(player.birth?.date))}</b></div><div><small>Рост</small><b>${esc(val(player.height))}</b></div><div><small>Вес</small><b>${esc(val(player.weight))}</b></div><div><small>Место рождения</small><b>${esc(val(player.birth?.place))}</b></div><div><small>Гражданство</small><b>${esc(val(player.nationality))}</b></div></div></section>${playerCurrentClubHtml(d,primary,club)}${playerRankingsHtml(d.rankings||{})}${matchPlayerStatsHtml(d.match)}${seasonPlayerStatsHtml(primary)}${allStats.length?`<section class="section"><h3>Статистика по каждому турниру <span>${allStats.length}</span></h3><div class="competitionstats">${allStats.slice(0,12).map(competitionCard).join('')}</div></section>`:''}${playerCareerHtml(d.career_teams||[],d.career_seasons||[])}${playerAbsencesHtml(d.injuries||[],d.sidelined||[])}${playerTransfersHtml(d.transfers||[])}${playerTrophiesHtml(d.trophies||[])}</div>`}catch(e){body.innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function closePlayer(){const overlay=$('#playerDetail');overlay.classList.add('hidden');document.body.style.overflow=$('#detail').classList.contains('hidden')?'':'hidden'}

function splitValue(obj,key,side){return obj?.[key]?.[side]??'—'}
function formHtml(form){const letters=String(form||'').slice(-10).split('');if(!letters.length)return'<div class="empty">Форма пока недоступна</div>';return `<div class="formrow">${letters.map(x=>`<span class="formbadge ${String(x).toLowerCase()}">${esc(x)}</span>`).join('')}</div>`}

function clubFormText(form){const letters=String(form||'').replace(/[^WDL]/gi,'').slice(-5).toUpperCase();return letters||'—'}
function splitRecord(fixtures,side){return `${splitValue(fixtures,'wins',side)}-${splitValue(fixtures,'draws',side)}-${splitValue(fixtures,'loses',side)}`}
function teamLatestSection(title,items,team){if(!items.length)return `<section class="section"><h3>${esc(title)}</h3><div class="emptycard">Данных пока нет</div></section>`;return `<section class="section team-last-wrap"><h3 class="matches-title">${esc(title)}</h3>${historyGroupedList(items,team?.id)}</section>`}

function safeNum(v){return v===0||v?String(v):'—'}
function minuteSegmentsHtml(s){const gf=s?.goals?.for?.minute||{},ga=s?.goals?.against?.minute||{},keys=['0-15','16-30','31-45','46-60','61-75','76-90'];return `<section class="team-block"><h3>Голы по минутам <span>забито / пропущено</span></h3><div class="minute-grid">${keys.map(key=>`<div class="minute-card"><b>${key}′</b><small>${gf[key]?.percentage||'—'} / ${ga[key]?.percentage||'—'}</small><div class="minute-values"><span class="for">↑ ${safeNum(gf[key]?.total)}</span><span class="against">↓ ${safeNum(ga[key]?.total)}</span></div></div>`).join('')}</div></section>`}
function goalAverageHtml(s){const gf=s?.goals?.for?.average||{},ga=s?.goals?.against?.average||{};return `<section class="team-block"><h3>Средние голы <span>за матч</span></h3><div class="avg-grid">${[['Дома',gf.home,ga.home],['В гостях',gf.away,ga.away],['Всего',gf.total,ga.total]].map(x=>`<div class="avg-card"><small>${x[0]}</small><b>${safeNum(x[1])} : ${safeNum(x[2])}</b></div>`).join('')}</div></section>`}
function biggestHtml(s){const b=s?.biggest||{};return `<section class="team-block"><h3>Крупнейшие результаты</h3><div class="big-results"><div class="big-result"><span>Самая крупная победа дома</span><b>${safeNum(b.wins?.home)}</b></div><div class="big-result"><span>Самая крупная победа в гостях</span><b>${safeNum(b.wins?.away)}</b></div><div class="big-result"><span>Самое крупное поражение дома</span><b>${safeNum(b.loses?.home)}</b></div><div class="big-result"><span>Самое крупное поражение в гостях</span><b>${safeNum(b.loses?.away)}</b></div></div></section>`}
function cleanAndStreakHtml(s){const c=s?.clean_sheet||{},f=s?.failed_to_score||{},st=s?.biggest?.streak||{};return `<section class="team-block"><h3>Сухие матчи и серии</h3><div class="clean-grid"><div class="clean-card"><small>Сухие матчи</small><b>${safeNum(c.total)}</b></div><div class="clean-card"><small>Без забитого гола</small><b>${safeNum(f.total)}</b></div><div class="clean-card"><small>Серия побед</small><b>${safeNum(st.wins)}</b></div></div><div class="streak-grid" style="margin-top:7px"><div class="streak-card"><small>Серия ничьих</small><b>${safeNum(st.draws)}</b></div><div class="streak-card"><small>Серия поражений</small><b>${safeNum(st.loses)}</b></div><div class="streak-card"><small>Форма</small><b>${esc(clubFormText(s?.form))}</b></div></div></section>`}
function coachHtml(coach){if(!coach)return `<section class="team-block"><h3>Тренер</h3><div class="trophy-note">API-Football не вернул текущего тренера для этого клуба.</div></section>`;const career=(coach.career||[]).slice(0,6);return `<section class="team-block"><h3>Текущий тренер <span>и карьера</span></h3><div class="coach-card">${coach.photo?`<img class="coach-photo" src="${esc(coach.photo)}" alt="">`:`<div class="coach-fallback">${esc((coach.name||'T').slice(0,1))}</div>`}<div><h4>${esc(coach.name||'—')}</h4><p>${esc(coach.nationality||'')}${coach.age?` · ${coach.age} лет`:''}</p><p>${esc(coach.team?.name||'')}</p></div></div>${career.length?`<div class="career-list">${career.map(x=>`<div class="career-row">${logo(x.team||{},'tinylogo')}<div><b>${esc(x.team?.name||'—')}</b><small>${esc(x.start||'—')} — ${esc(x.end||'сейчас')}</small></div></div>`).join('')}</div>`:''}</section>`}
function transferItems(data){const out=[];for(const item of (data||[])){for(const tr of (item.transfers||[])){out.push({player:item.player||{},date:tr.date||item.update||'',type:tr.type||'',teams:tr.teams||{}})}}return out.sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,10)}
function transfersHtml(data,teamId=0){const items=transferItems(data);return `<section class="team-block"><h3>Трансферы игроков <span>последние</span></h3>${items.length?`<div class="transfer-list">${items.map(x=>{const pid=Number(x.player?.id||0),encoded=encodeURIComponent(String(x.player?.name||'Игрок'));return `<div class="transfer-row"><div class="transfer-top">${pid?`<button class="transfer-player" onclick="openPlayer(${pid},decodeURIComponent('${encoded}'),${Number(teamId||0)})"><span>${esc(x.player?.name||'Игрок')}</span><span class="player-mini-arrow">›</span></button>`:`<b>${esc(x.player?.name||'Игрок')}</b>`}<small>${esc(x.date||'')}</small></div><div class="transfer-flow"><div class="transfer-team">${logo(x.teams?.out||{},'tinylogo')}<span>${esc(x.teams?.out?.name||'—')}</span></div><div class="transfer-arrow">→</div><div class="transfer-team">${logo(x.teams?.in||{},'tinylogo')}<span>${esc(x.teams?.in?.name||'—')}</span></div></div>${x.type?`<div class="transfer-type">${esc(x.type)}</div>`:''}</div>`}).join('')}</div>`:'<div class="trophy-note">Трансферы пока недоступны.</div>'}</section>`}
function teamExtendedHtml(d){const s=d.statistics||{};return `<div class="team-detail-stack">${minuteSegmentsHtml(s)}${goalAverageHtml(s)}${biggestHtml(s)}${cleanAndStreakHtml(s)}${coachHtml(d.coach)}${transfersHtml(d.transfers,Number(d?.team?.team?.id||0))}</div>`}

function teamStatisticsHtml(d){const s=d.statistics||{},f=s.fixtures||{},gf=s.goals?.for||{},ga=s.goals?.against||{},standing=d.standing||{},league=s.league||{};if(!d.statistics)return `<section class="section"><h3>Статистика команды</h3><div class="team-stat-note">Для выбранной лиги и сезона API-Football не вернул командную статистику. Последние матчи клуба ниже всё равно доступны.</div></section>`;const seasonLabel=`${esc(league.name||'Лига')}`;const yearLabel=`${esc(String(league.season||d.context?.season||'—'))}`;return `<section class="section seasoncard"><div class="seasonhead"><b>SEASON · <span>${seasonLabel.toUpperCase()}</span></b><div class="seasonpill">${yearLabel}</div></div><div class="seasonlist"><div class="seasonrow"><div class="sicon">〰</div><div class="slabel">Season form</div><div class="svalue form">${esc(clubFormText(s.form||standing.form))}</div></div><div class="seasonrow"><div class="sicon">🏆</div><div class="slabel">W-D-L</div><div class="svalue">${f.wins?.total??'—'}-${f.draws?.total??'—'}-${f.loses?.total??'—'}</div></div><div class="seasonrow"><div class="sicon">◎</div><div class="slabel">Goals for / against</div><div class="svalue">${gf.total?.total??'—'} : ${ga.total?.total??'—'}</div></div><div class="seasonrow"><div class="sicon">🛡</div><div class="slabel">Clean sheets</div><div class="svalue">${s.clean_sheet?.total??'—'}</div></div><div class="seasonrow"><div class="sicon">⌂</div><div class="slabel">Home</div><div class="svalue">${splitRecord(f,'home')}</div></div><div class="seasonrow"><div class="sicon">✈</div><div class="slabel">Away</div><div class="svalue">${splitRecord(f,'away')}</div></div></div></section>`}
async function openTeam(id,league=0,season=0){if(!id)return;const seed=state['team_'+id]||{};$('#teamDetail').classList.remove('hidden');document.body.style.overflow='hidden';$('#teamBody').innerHTML=`<div class="clubhero">${(seed.team?.logo)?`<img class="clubhero-logo" src="${esc(seed.team.logo)}" alt="">`:logo(seed.team||{},'bigfallback')}<div><h2>${esc(seed.team?.name||'Клуб')}</h2><div class="clubhero-meta">${esc(seed.team?.country||'')}</div><div class="clubhero-sub">Загружаю статистику клуба…</div></div></div><div class="loading"><i></i>Загружаю статистику клуба…</div>`;try{const query=`team=${id}${league?`&league=${league}`:''}${season?`&season=${season}`:''}`,d=await api(`/api-football/team-profile?${query}`);updateQuota(d);state.teamProfile=d;const item=d.team||seed,t=item.team||{},v=item.venue||{},st=d.statistics||{},lg=st.league||{};rememberFixtures([...(d.last||[]),...(d.next||[])]);state['team_'+id]=item;$('#teamBody').innerHTML=`<div class="clubhero">${t.logo?`<img class="clubhero-logo" src="${esc(t.logo)}" alt="">`:logo(t,'bigfallback')}<div><h2>${esc(t.name||'Клуб')}</h2><div class="clubhero-meta">${esc(t.country||'')}${t.founded?` · основан: ${esc(t.founded)}`:''}</div><div class="clubhero-sub">${v.city?`Город: ${esc(v.city)}`:''}${v.name?`${v.city?' · ':''}Стадион: ${esc(v.name)}`:''}</div></div></div><div class="dbody">${teamStatisticsHtml(d)}${teamExtendedHtml(d)}${teamLatestSection('ПОСЛЕДНИЕ МАТЧИ',d.last||[],t)}</div>`}catch(e){$('#teamBody').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function fixtureSection(title,items){if(!items.length)return`<section class="section"><h3>${esc(title)}</h3><div class="empty">Данных пока нет</div></section>`;return `<section class="section"><h3>${esc(title)}</h3><div class="matches">${items.map(matchRow).join('')}</div></section>`}
function leagueContext(){const d=state.leagueView||{},item=d.league||{},lg=item.league||item||{};return {id:Number(lg.id||0),season:Number(d.season||0),league:lg,country:item.country||{},data:d}}
function renderLeagueShell(){const x=leagueContext(),lg=x.league||{},ct=x.country||{};$('#leagueBody').innerHTML=`<div class="league-profile">${lg.logo?`<img src="${esc(lg.logo)}" alt="">`:''}<h2>${esc(lg.name||'Лига')}</h2><p>${esc(ct.name||'')} · сезон ${esc(x.season||'—')}</p></div><nav class="league-nav"><button class="league-tab" data-league-tab="table">Таблица</button><button class="league-tab" data-league-tab="leaders">Лидеры</button><button class="league-tab" data-league-tab="calendar">Календарь</button><button class="league-tab" data-league-tab="teams">Команды</button><button class="league-tab" data-league-tab="seasons">Сезоны</button></nav><div class="league-tab-body" id="leagueTabBody"></div>`;$$('.league-tab').forEach(b=>b.onclick=()=>loadLeagueTab(b.dataset.leagueTab));loadLeagueTab(state.leagueTab||'table')}
async function openLeague(id,season){const seed=state['league_'+id]||{},l=seed.league||{},c=seed.country||{};$('#leagueDetail').classList.remove('hidden');document.body.style.overflow='hidden';state.leagueTab='table';state.leagueTableMode='all';state.leagueRound='';state.leagueCache.clear();$('#leagueBody').innerHTML=`<div class="league-profile">${l.logo?`<img src="${esc(l.logo)}" alt="">`:''}<h2>${esc(l.name||'Лига')}</h2><p>${esc(c.name||'')} · сезон ${season}</p></div><div class="loading"><i></i>Загружаю лигу…</div>`;try{const d=await api(`/api-football/league-view?league=${id}&season=${season}`);updateQuota(d);state.leagueView=d;state.leagueRound=d.current_round||'';rememberFixtures(d.next||[]);renderLeagueShell()}catch(e){$('#leagueBody').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
async function loadLeagueTab(tab,force=false){const x=leagueContext();if(!x.id||!x.season)return;state.leagueTab=tab;$$('.league-tab').forEach(b=>b.classList.toggle('active',b.dataset.leagueTab===tab));const body=$('#leagueTabBody');if(!body)return;const key=`${x.id}:${x.season}:${tab}:${tab==='calendar'?state.leagueRound:''}`;if(!force&&state.leagueCache.has(key)){body.innerHTML=state.leagueCache.get(key);return}body.innerHTML='<div class="loading"><i></i>Загружаю данные…</div>';try{let html='';if(tab==='table')html=leagueTableHtml(x.data.standings||[]);else if(tab==='leaders')html=await leagueLeadersHtml(x);else if(tab==='calendar')html=await leagueCalendarHtml(x);else if(tab==='teams')html=await leagueTeamsHtml(x);else if(tab==='seasons')html=await leagueSeasonsHtml(x);else html=leagueTableHtml(x.data.standings||[]);state.leagueCache.set(key,html);body.innerHTML=html}catch(e){body.innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function tableRowsForMode(rows,mode){if(mode==='all')return (rows||[]).map(r=>({...r,_stats:r.all||{},_points:r.points??0,_diff:r.goalsDiff??0,_rank:r.rank??0}));const out=(rows||[]).map(r=>{const s=r?.[mode]||{},gf=Number(s.goals?.for||0),ga=Number(s.goals?.against||0),points=Number(s.win||0)*3+Number(s.draw||0);return {...r,_stats:s,_points:points,_diff:gf-ga}});out.sort((a,b)=>b._points-a._points||b._diff-a._diff||Number(b._stats?.goals?.for||0)-Number(a._stats?.goals?.for||0));return out.map((r,i)=>({...r,_rank:i+1}))}
function setLeagueTableMode(mode){state.leagueTableMode=mode;const body=$('#leagueTabBody');if(body)body.innerHTML=leagueTableHtml(leagueContext().data.standings||[])}
function leagueTableHtml(rows){if(!rows.length)return '<div class="league-info-note">Таблица для этой лиги и сезона недоступна.</div>';const mode=state.leagueTableMode||'all',data=tableRowsForMode(rows,mode);return `<section class="section tablecard"><div class="tabletitle"><h3>Турнирная таблица</h3><small>${mode==='all'?'общая':mode==='home'?'дома':'в гостях'}</small></div><div class="league-mode"><button class="${mode==='all'?'active':''}" onclick="setLeagueTableMode('all')">Общая</button><button class="${mode==='home'?'active':''}" onclick="setLeagueTableMode('home')">Дома</button><button class="${mode==='away'?'active':''}" onclick="setLeagueTableMode('away')">В гостях</button></div><div class="tablewrap"><table class="standing league-table-wide"><thead><tr><th>#</th><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>ЗМ</th><th>ПМ</th><th>РМ</th><th>Форма</th><th style="text-align:right">О</th></tr></thead><tbody>${data.map(r=>`<tr><td class="rank">${r._rank??'—'}</td><td class="teamcell">${r.team?.logo?`<img src="${esc(r.team.logo)}" alt="">`:''}<span>${esc(r.team?.name||'—')}</span></td><td>${r._stats?.played??'—'}</td><td>${r._stats?.win??'—'}</td><td>${r._stats?.draw??'—'}</td><td>${r._stats?.lose??'—'}</td><td>${r._stats?.goals?.for??'—'}</td><td>${r._stats?.goals?.against??'—'}</td><td>${r._diff??'—'}</td><td class="formcell">${esc(r.form||'—')}</td><td class="pts">${r._points??'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
function leaderMetric(item,type){const s=(item?.statistics||[])[0]||{},g=s.goals||{},c=s.cards||{};if(type==='topscorers')return [g.total??0,'голов'];if(type==='topassists')return [g.assists??0,'ассистов'];if(type==='topyellowcards')return [c.yellow??0,'жёлтых'];return [c.red??0,'красных']}
function leaderBlock(title,items,type){const rows=(items||[]).slice(0,10);return `<section class="leader-block"><h3>${esc(title)}</h3>${rows.length?`<div class="leader-list">${rows.map((item,index)=>{const p=item.player||{},s=(item.statistics||[])[0]||{},team=s.team||{},metric=leaderMetric(item,type);return `<div class="leader-row"><div class="leader-rank">${index+1}</div>${p.photo?`<img class="leader-photo" src="${esc(p.photo)}" alt="">`:`<div class="leader-fallback">${esc(initials(p.name))}</div>`}<div class="leader-main"><b>${esc(p.name||'Игрок')}</b><small>${esc(team.name||'')}</small></div><div class="leader-value"><b>${metric[0]}</b><small>${metric[1]}</small></div></div>`}).join('')}</div>`:'<div class="league-info-note">Данные недоступны для этой лиги.</div>'}</section>`}
async function leagueLeadersHtml(x){const d=await api(`/api-football/league-leaders?league=${x.id}&season=${x.season}`);updateQuota(d);const l=d.leaders||{};return `${leaderBlock('Лучшие бомбардиры',l.topscorers,'topscorers')}${leaderBlock('Лучшие ассистенты',l.topassists,'topassists')}${leaderBlock('Больше всего жёлтых карточек',l.topyellowcards,'topyellowcards')}${leaderBlock('Больше всего красных карточек',l.topredcards,'topredcards')}`}
async function changeLeagueRound(value){state.leagueRound=value;for(const key of [...state.leagueCache.keys()])if(key.includes(':calendar:'))state.leagueCache.delete(key);await loadLeagueTab('calendar',true)}
async function leagueCalendarHtml(x){const q=state.leagueRound?`&round=${encodeURIComponent(state.leagueRound)}`:'';const d=await api(`/api-football/league-calendar?league=${x.id}&season=${x.season}${q}`);updateQuota(d);state.leagueRound=d.round||state.leagueRound;const fixtures=d.fixtures||[];rememberFixtures(fixtures);const rounds=d.rounds||[];return `<section class="section"><h3>Календарь по турам <span>${esc(d.round||'')}</span></h3>${rounds.length?`<select class="round-select" onchange="changeLeagueRound(this.value)">${rounds.map(r=>`<option value="${esc(r)}" ${r===d.round?'selected':''}>${esc(r)}</option>`).join('')}</select>`:''}${fixtures.length?`<div class="league-fixtures">${fixtures.map(matchRow).join('')}</div>`:'<div class="league-info-note">Матчи этого тура пока недоступны.</div>'}</section>`}
async function leagueTeamsHtml(x){const d=await api(`/api-football/league-teams?league=${x.id}&season=${x.season}`);updateQuota(d);const items=d.teams||[];return `<section class="section"><h3>Команды сезона <span>${items.length}</span></h3>${items.length?`<div class="league-team-list">${items.map(item=>{const t=item.team||{},v=item.venue||{};return `<div class="league-team-item">${logo(t,'teamlogo')}<div><b>${esc(t.name||'Команда')}</b><small>${esc(t.country||v.city||'')}</small></div></div>`}).join('')}</div>`:'<div class="league-info-note">Список команд недоступен.</div>'}</section>`}
async function leagueSeasonsHtml(x){const d=await api(`/api-football/league-seasons?league=${x.id}&season=${x.season}`);updateQuota(d);const seasons=(d.seasons||[]).slice().sort((a,b)=>Number(b.year||0)-Number(a.year||0)),winners=d.winners||[];return `<section class="section"><h3>Прошедшие сезоны <span>${seasons.length}</span></h3>${seasons.length?`<div class="season-list">${seasons.map(s=>`<div class="season-row ${s.current?'current':''}"><div><b>${esc(s.year||'—')}${s.current?' · текущий':''}</b><small>${esc(s.start||'')} — ${esc(s.end||'')}</small></div><button class="season-open" onclick="openLeague(${x.id},${Number(s.year||x.season)})">Открыть</button></div>`).join('')}</div>`:'<div class="league-info-note">Список сезонов недоступен.</div>'}</section><section class="section"><h3>Победители прошлых сезонов <span>до 5 сезонов</span></h3>${winners.length?`<div class="winner-list">${winners.map(w=>`<div class="winner-row"><div><b>${esc(w.season||'—')}</b><small>Победитель сезона</small></div>${w.team?`<div class="winner-team">${logo(w.team,'tinylogo')}<span>${esc(w.team.name||'—')}</span></div>`:'<small>Данные недоступны</small>'}</div>`).join('')}</div>`:'<div class="league-info-note">Победители недоступны: для кубков или некоторых сезонов API не возвращает таблицу.</div>'}</section>`}
function standingsHtml(rows){return leagueTableHtml(rows)}
function openNotify(){const host=$('#notifyHost'),frame=$('#notifyFrame');host.classList.remove('hidden');document.body.style.overflow='hidden';if(!frame.src){const suffix=(location.search||'')+(location.hash||'');frame.src='/notify/'+suffix}history.pushState({notify:true},'',location.href)}
function closeNotify(){const host=$('#notifyHost');host.classList.add('hidden');document.body.style.overflow=''}
$('#searchToggle').onclick=()=>{$('#searchrow').classList.toggle('hidden');if(!$('#searchrow').classList.contains('hidden'))setTimeout(()=>$('#searchInput').focus(),50)};
$('#searchInput').oninput=onSearchInput;$('#searchClear').onclick=clearSearch;
$('#navMatches').onclick=showMatches;$('#navLeagues').onclick=()=>{clearSearch();loadLeagues()};$('#navFavorites').onclick=()=>showFavorites(state.favoriteTab);$('#backMatches').onclick=closeNotify;
$$('.seg').forEach((b,i)=>b.onclick=()=>{state.filter=b.dataset.filter;closeNotify();$$('.seg').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#indicator').style.transform=`translateX(${i*100}%)`;setViewUI();if(state.filter!=='live')hideLiveSegCount();renderFixtures()});
$('#closeDetail').onclick=()=>closeOverlay('#detail');$('#closeTeam').onclick=()=>closeOverlay('#teamDetail');$('#closeLeague').onclick=()=>closeOverlay('#leagueDetail');$('#closePlayer').onclick=closePlayer;$('#detailRefresh').onclick=()=>loadDetailTab(state.tab,true);$('#goalNotifyBtn').onclick=toggleGoalNotify;$$('.tab').forEach(b=>b.onclick=()=>loadDetailTab(b.dataset.tab));
window.onpopstate=()=>{if(!$('#notifyHost').classList.contains('hidden'))closeNotify();else if(!$('#playerDetail').classList.contains('hidden'))closePlayer();else if(!$('#teamDetail').classList.contains('hidden'))closeOverlay('#teamDetail');else if(!$('#leagueDetail').classList.contains('hidden'))closeOverlay('#leagueDetail');else if(!$('#detail').classList.contains('hidden'))closeOverlay('#detail')};
loadFavorites();buildDates();setViewUI();loadFixtures();setInterval(()=>{if(state.view==='matches'&&state.date===ymd(new Date())&&document.visibilityState==='visible'&&$('#detail').classList.contains('hidden')&&$('#teamDetail').classList.contains('hidden')&&$('#leagueDetail').classList.contains('hidden')&&$('#notifyHost').classList.contains('hidden')&&!state.query)loadFixtures()},60000);
</script>
</body>
</html>
