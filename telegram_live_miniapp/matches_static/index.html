t:30px}.historyhead b{display:block;font-size:11px}.historyhead small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.historyrows{display:grid;gap:8px}.historyrow{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;padding:9px 10px;border-radius:12px;background:#0c151d}.resultpill{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:900}.resultpill.win{background:rgba(82,221,160,.15);color:var(--green)}.resultpill.draw{background:rgba(255,198,91,.14);color:var(--amber)}.resultpill.lose{background:rgba(255,110,124,.14);color:var(--red)}.historymeta{min-width:0}.historymeta b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.historymeta small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.historyscore{text-align:right}.historyscore b{display:block;font-size:12px}.historyscore small{display:block;color:#87a1b2;font-size:8px;margin-top:2px}.tablecard{padding:0;overflow:hidden}.tabletitle{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px}.tabletitle small{color:var(--muted);font-size:8px}.standing tr.mine{background:rgba(89,179,241,.08)}.standing td.teamcell{display:flex;align-items:center;gap:6px;font-weight:700}.standing td.teamcell span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.standing td.teamcell img{margin-right:0}.standing tr.mine td.teamcell span{color:#d9eefc}.standing td.formcell{font-weight:800;color:#89a1b3}.section.compact h3{margin-bottom:8px}.emptycard{padding:16px;border-radius:14px;background:#0d1721;color:#89a0b2;font-size:10px;text-align:center;border:1px solid rgba(255,255,255,.04)}

<body>
<div class="app" id="app">
  <header class="top">
    <div class="bar"><div class="brandmark">⚽</div><div class="brand"><h1 id="title">Матчи</h1><small><i class="dot"></i><span id="subtitle">LIVE и прематч через API-Football</span></small></div><div class="actions"><button class="iconbtn" id="searchToggle" aria-label="Поиск"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg></button><button class="iconbtn" id="refreshBtn" aria-label="Обновить"><svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.4L3 9m0 0V4m0 5h5M4 13a8 8 0 0 0 14.7 4.4L21 15m0 0v5m0-5h-5"/></svg></button></div></div>
    <div id="matchControls">
      <div class="datebar" id="datebar"></div>
      <nav class="segment"><i class="indicator" id="indicator"></i><button class="seg active" data-filter="all">Все</button><button class="seg" data-filter="live">LIVE</button><button class="seg" data-filter="upcoming">Скоро</button><button class="seg" data-filter="finished">Завершены</button></nav>
    </div>
    <div class="searchrow hidden" id="searchrow"><label class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg><input id="searchInput" autocomplete="off" placeholder="Найти любой клуб"/><button type="button" class="searchclear hidden" id="searchClear">×</button></label></div>
    <div class="quota" id="quota"><span>API-Football</span><b>кэш включён</b></div>
  </header>
  <main class="content" id="content"></main>
  <nav class="bottom"><button class="nav active" id="navMatches"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m12 3 3 4-1 5h-4L9 7l3-4ZM5 9l5 3-1 4-5 1M19 9l-5 3 1 4 5 1M9 16l3 5 3-5"/></svg>Матчи</button><button class="nav" id="navLeagues"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 5v14M16 5v14M4 10h16M4 15h16"/></svg>Лиги</button><button class="nav" id="openNotify"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>Уведомления</button></nav>
</div>

<section class="overlay hidden" id="detail">
  <header class="dtop"><button class="iconbtn" id="closeDetail"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="dtitle"><b id="detailLeague">Матч</b><small id="detailMeta"></small></div><button class="iconbtn" id="detailRefresh"><svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.4L3 9m0 0V4m0 5h5M4 13a8 8 0 0 0 14.7 4.4L21 15m0 0v5m0-5h-5"/></svg></button></header>
  <div class="hero"><div class="herostatus" id="detailStatus"></div><div class="teams"><div class="dteam" id="homeTeam"></div><div class="bigscore"><strong id="detailScore">— : —</strong><small id="detailTime"></small></div><div class="dteam" id="awayTeam"></div></div></div>
  <nav class="tabs"><button class="tab active" data-tab="overview">Обзор</button><button class="tab" data-tab="stats">Статистика</button><button class="tab" data-tab="events">События</button><button class="tab" data-tab="lineups">Составы</button><button class="tab" data-tab="matches">Матчи</button><button class="tab" data-tab="table">Таблица</button><button class="tab" data-tab="h2h">H2H</button><button class="tab" data-tab="trends">Тренды</button></nav>
  <div class="dbody" id="detailBody"></div>
</section>

<section class="overlay hidden" id="teamDetail"><header class="dtop"><button class="iconbtn" id="closeTeam"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="dtitle"><b>Клуб</b><small>Матчи и информация</small></div><span style="width:34px"></span></header><div id="teamBody"></div></section>
<section class="overlay hidden" id="leagueDetail"><header class="dtop"><button class="iconbtn" id="closeLeague"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="dtitle"><b>Лига</b><small>Таблица и ближайшие матчи</small></div><span style="width:34px"></span></header><div id="leagueBody"></div></section>

<div class="notifyhost hidden" id="notifyHost"><div class="notifybar"><button id="backMatches">‹ Назад</button><b>Уведомления</b></div><iframe class="notifyframe" id="notifyFrame" title="Готовый бот уведомлений"></iframe></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const liveCodes=new Set(['1H','HT','2H','ET','BT','P','SUSP','INT','LIVE']);
const finishedCodes=new Set(['FT','AET','PEN']);
const state={view:'matches',date:ymd(new Date()),filter:'all',fixtures:[],leagues:[],loading:false,query:'',selected:null,tab:'overview',tabCache:new Map(),fixtureMap:new Map(),teamTimer:null,teamRequest:0,teamProfile:null,leagueView:null,pressureTimer:null};
try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.setHeaderColor('#0f1923');Telegram.WebApp.setBackgroundColor('#0f1923')}catch(e){}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function api(path){return fetch(path,{headers:{Accept:'application/json'}}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||d.errors?.request||`HTTP ${r.status}`);if(d.errors&&Object.keys(d.errors).length)throw new Error(Object.values(d.errors).join(', '));return d})}
function initials(name){return String(name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase()}
function logo(team,cls='teamlogo'){return team?.logo?`<img class="${cls}" src="${esc(team.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\'${cls} fallback\'>${esc(initials(team.name))}</span>'">`:`<span class="${cls} fallback">${esc(initials(team?.name))}</span>`}
function bigLogo(team){return logo(team,'bigfallback')}
function rememberFixtures(items){for(const x of items||[]){const id=Number(x?.fixture?.id);if(id)state.fixtureMap.set(id,x)}}
function buildDates(){const box=$('#datebar');box.innerHTML='';for(let i=-3;i<=3;i++){const d=new Date();d.setDate(d.getDate()+i);const b=document.createElement('button');b.className='date'+(ymd(d)===state.date?' active':'');b.innerHTML=`<small>${i===0?'СЕГОДНЯ':d.toLocaleDateString('ru-RU',{weekday:'short'}).replace('.','').toUpperCase()}</small><b>${String(d.getDate()).padStart(2,'0')}</b>`;b.onclick=()=>{state.date=ymd(d);buildDates();clearSearch();loadFixtures()};box.appendChild(b)}}
function updateQuota(d){const q=d?._quota||d?.quota||{};const el=$('#quota');if(q.limit!=null&&q.remaining!=null)el.innerHTML=`<span>API-Football сегодня</span><b>${Number(q.remaining).toLocaleString('ru-RU')} из ${Number(q.limit).toLocaleString('ru-RU')} осталось</b>`;else el.innerHTML=`<span>API-Football</span><b>${d?.demo?'демо':'кэш включён'}</b>`}
function timeLabel(x){const s=x.fixture?.status||{};if(liveCodes.has(s.short))return `${s.elapsed||0}′`;if(finishedCodes.has(s.short))return'ФТ';const date=new Date(x.fixture?.date||'');return Number.isNaN(date.getTime())?'—':date.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function fixtureState(x){const code=x.fixture?.status?.short||'';return liveCodes.has(code)?'live':finishedCodes.has(code)?'finished':'upcoming'}
function renderFixtures(){const q=state.query.trim().toLowerCase();let list=state.fixtures.filter(x=>state.filter==='all'||fixtureState(x)===state.filter);if(q)list=list.filter(x=>`${x.teams?.home?.name||''} ${x.teams?.away?.name||''} ${x.league?.name||''}`.toLowerCase().includes(q));if(!list.length){$('#content').innerHTML='<div class="empty">На выбранную дату матчей нет</div>';return}const groups=new Map();for(const x of list){const l=x.league||{},key=`${l.id||0}|${l.country||'Мир'}|${l.name||'Лига'}|${l.logo||''}|${l.flag||''}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}$('#content').innerHTML=[...groups].map(([key,items])=>{const[,country,name,llogo,flag]=key.split('|');return `<section class="league"><div class="leaguehead">${llogo?`<img src="${esc(llogo)}" alt="">`:(flag?`<img src="${esc(flag)}" alt="">`:'<span class="flag">⚽</span>')}<b>${esc(country.toUpperCase())} — ${esc(name.toUpperCase())}</b></div><div class="matches">${items.map(matchRow).join('')}</div></section>`}).join('')}
function matchRow(x){const id=Number(x.fixture?.id),t=x.teams||{},g=x.goals||{},l=x.league||{},fs=fixtureState(x),tl=timeLabel(x);if(t.home?.id)state['team_'+t.home.id]={team:t.home,venue:{}};if(t.away?.id)state['team_'+t.away.id]={team:t.away,venue:{}};return `<article class="match" onclick="openMatch(${id})"><div class="mtime ${fs==='live'?'live':fs==='upcoming'?'soon':''}">${fs==='live'?'<i class="pulse"></i>':''}<span>${esc(tl)}</span></div><div><div class="teamline"><button class="teamlink" onclick="event.stopPropagation();openTeam(${Number(t.home?.id||0)},${Number(l.id||0)},${Number(l.season||0)})">${logo(t.home)}<span class="teamname">${esc(t.home?.name||'—')}</span></button><b class="score">${g.home??'—'}</b></div><div class="teamline"><button class="teamlink" onclick="event.stopPropagation();openTeam(${Number(t.away?.id||0)},${Number(l.id||0)},${Number(l.season||0)})">${logo(t.away)}<span class="teamname">${esc(t.away?.name||'—')}</span></button><b class="score">${g.away??'—'}</b></div></div><div class="mact"><svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div></article>`}
async function loadFixtures(force=false){if(state.loading)return;state.loading=true;$('#content').innerHTML='<div class="loading"><i></i>Загружаю матчи…</div>';try{const d=await api(`/api-football/fixtures?date=${encodeURIComponent(state.date)}&timezone=Europe%2FMoscow${force?'&force=1':''}`);state.fixtures=d.response||[];rememberFixtures(state.fixtures);updateQuota(d);renderFixtures();$('#subtitle').textContent=d.demo?'Демо-режим':'LIVE и прематч через API-Football'}catch(e){$('#content').innerHTML=`<div class="errorbox"><b>Не удалось загрузить матчи</b><br>${esc(e.message)}</div>`}finally{state.loading=false}}
function commonAlias(q){const x=q.trim().toLowerCase();const a={'реал':'Real Madrid','реал мадрид':'Real Madrid','барселона':'Barcelona','арсенал':'Arsenal','челси':'Chelsea','ливерпуль':'Liverpool','манчестер сити':'Manchester City','ман сити':'Manchester City','манчестер юнайтед':'Manchester United','ман юнайтед':'Manchester United','бавария':'Bayern Munich','боруссия дортмунд':'Borussia Dortmund','интер':'Inter','милан':'AC Milan','ювентус':'Juventus','псж':'Paris Saint Germain'};if(a[x])return a[x];const map={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ы':'y','э':'e','ю':'yu','я':'ya','ь':'','ъ':''};return /[а-яё]/i.test(x)?x.split('').map(c=>map[c]??c).join(''):q.trim()}
function onSearchInput(){const q=$('#searchInput').value.trim();state.query=q;$('#searchClear').classList.toggle('hidden',!q);if(state.view==='leagues'){renderLeagues();return}clearTimeout(state.teamTimer);if(!q){renderFixtures();return}if(q.length<3){$('#content').innerHTML='<div class="hint"><b>Поиск любого клуба</b><br>Введите минимум 3 буквы. Можно писать по-русски или по-английски.</div>';return}state.teamTimer=setTimeout(()=>searchTeams(q),350)}
async function searchTeams(q){const request=++state.teamRequest;$('#content').innerHTML='<div class="loading"><i></i>Ищу клуб по всей базе…</div>';try{const term=commonAlias(q),d=await api(`/api-football/teams?search=${encodeURIComponent(term)}`);if(request!==state.teamRequest)return;updateQuota(d);const items=d.response||[];if(!items.length){$('#content').innerHTML='<div class="empty">Клуб не найден. Попробуйте официальное название команды.</div>';return}$('#content').innerHTML=`<div class="pageintro"><h2>Найденные клубы</h2><p>Поиск выполняется по всей базе API-Football, а не только по матчам дня.</p></div><div class="resultcount">Найдено: ${items.length}</div><div class="teamgrid">${items.map(teamCard).join('')}</div>`}catch(e){if(request===state.teamRequest)$('#content').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function teamCard(item){const t=item.team||{},v=item.venue||{};state['team_'+t.id]=item;return `<button class="teamcard" onclick="openTeam(${Number(t.id)})">${logo(t,'teamlogo')}<span><b>${esc(t.name||'Клуб')}</b><small>${esc(t.country||'Страна не указана')}${v.city?` · ${esc(v.city)}`:''}${t.founded?` · основан в ${esc(t.founded)}`:''}</small></span><span class="arrow">›</span></button>`}
function clearSearch(){state.query='';state.teamRequest++;const input=$('#searchInput');if(input)input.value='';$('#searchClear').classList.add('hidden');if(state.view==='matches')renderFixtures();else renderLeagues()}
async function loadLeagues(force=false){state.view='leagues';setViewUI();if(state.leagues.length&&!force){renderLeagues();return}$('#content').innerHTML='<div class="loading"><i></i>Загружаю лиги…</div>';try{const d=await api('/api-football/leagues');state.leagues=d.response||[];updateQuota(d);renderLeagues()}catch(e){$('#content').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function currentSeason(item){const seasons=item.seasons||[];return seasons.find(x=>x.current)||seasons[seasons.length-1]||{year:new Date().getFullYear()}}
function renderLeagues(){const q=$('#searchInput').value.trim().toLowerCase();let items=state.leagues.filter(x=>{const l=x.league||{},c=x.country||{};return !q||`${l.name||''} ${c.name||''} ${l.type||''}`.toLowerCase().includes(q)});items.sort((a,b)=>String(a.country?.name||'').localeCompare(String(b.country?.name||''),'ru')||String(a.league?.name||'').localeCompare(String(b.league?.name||''),'ru'));if(!items.length){$('#content').innerHTML='<div class="empty">Лиги не найдены</div>';return}const groups=new Map();for(const item of items){const country=item.country?.name||'Мир';if(!groups.has(country))groups.set(country,[]);groups.get(country).push(item)}const visible=[...groups.entries()];$('#content').innerHTML=`<div class="pageintro"><h2>Лиги и кубки</h2><p>Нажмите на турнир, чтобы открыть таблицу и ближайшие матчи. Список кэшируется на сутки и почти не расходует лимит.</p></div>${visible.map(([country,list])=>`<section class="countrygroup"><div class="countrytitle">${list[0]?.country?.flag?`<img src="${esc(list[0].country.flag)}" alt="">`:'⚽'} ${esc(country)}</div><div class="leaguegrid">${list.map(leagueCard).join('')}</div></section>`).join('')}`}
function leagueCard(item){const l=item.league||{},c=item.country||{},s=currentSeason(item);state['league_'+l.id]=item;return `<button class="leaguecard" onclick="openLeague(${Number(l.id)},${Number(s.year)})">${l.logo?`<img src="${esc(l.logo)}" alt="">`:'<span class="teamlogo fallback">L</span>'}<span><b>${esc(l.name||'Лига')}</b><small>${esc(c.name||'Мир')} · сезон ${esc(s.year||'—')}</small></span><span class="leaguetype">${esc(l.type||'')}</span><span class="arrow">›</span></button>`}
function setViewUI(){const isMatches=state.view==='matches';$('#navMatches').classList.toggle('active',isMatches);$('#navLeagues').classList.toggle('active',!isMatches);$('#matchControls').classList.toggle('hidden',!isMatches);$('#title').textContent=isMatches?'Матчи':'Лиги';$('#subtitle').textContent=isMatches?'LIVE и прематч через API-Football':'Все доступные соревнования';$('#searchInput').placeholder=isMatches?'Найти любой клуб':'Найти лигу или страну';$('#refreshBtn').onclick=()=>isMatches?loadFixtures(true):loadLeagues(true)}
function showMatches(){state.view='matches';clearSearch();setViewUI();renderFixtures()}
function stopPressureTimer(){if(state.pressureTimer){clearInterval(state.pressureTimer);state.pressureTimer=null}}
function startPressureTimer(){stopPressureTimer();const status=state.selected?.fixture?.status||{};if(!liveCodes.has(status.short)||state.tab!=='overview')return;state.pressureTimer=setInterval(()=>{if(state.selected&&state.tab==='overview'&&!$('#detail').classList.contains('hidden')&&document.visibilityState==='visible')loadDetailTab('overview',true)},90000)}
function openMatch(id){stopPressureTimer();const x=state.fixtureMap.get(Number(id));if(!x)return;state.selected=x;state.tab='overview';state.tabCache.clear();const l=x.league||{},t=x.teams||{},g=x.goals||{},s=x.fixture?.status||{};if(t.home?.id)state['team_'+t.home.id]={team:t.home,venue:{}};if(t.away?.id)state['team_'+t.away.id]={team:t.away,venue:{}};$('#detailLeague').textContent=l.name||'Матч';$('#detailMeta').textContent=`${l.country||'Мир'} · ${l.round||''}`;$('#detailStatus').textContent=liveCodes.has(s.short)?`LIVE · ${s.elapsed||''} МИНУТА`:(finishedCodes.has(s.short)?'МАТЧ ЗАВЕРШЁН':s.long||'ПРЕДСТОЯЩИЙ МАТЧ');$('#homeTeam').classList.add('team-click');$('#awayTeam').classList.add('team-click');$('#homeTeam').innerHTML=`${logo(t.home,'bigfallback')}<b>${esc(t.home?.name||'—')}</b><small>Открыть клуб</small>`;$('#awayTeam').innerHTML=`${logo(t.away,'bigfallback')}<b>${esc(t.away?.name||'—')}</b><small>Открыть клуб</small>`;$('#homeTeam').onclick=()=>openTeam(Number(t.home?.id||0),Number(l.id||0),Number(l.season||0));$('#awayTeam').onclick=()=>openTeam(Number(t.away?.id||0),Number(l.id||0),Number(l.season||0));$('#detailScore').textContent=`${g.home??'—'} : ${g.away??'—'}`;$('#detailTime').textContent=timeLabel(x);$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='overview'));$('#detail').classList.remove('hidden');document.body.style.overflow='hidden';loadDetailTab('overview')}
function closeOverlay(id){$(id).classList.add('hidden');document.body.style.overflow=''}
async function pressureHtml(){const x=state.selected||{},id=x.fixture?.id,elapsed=x.fixture?.status?.elapsed||0;if(!id)return'';try{const d=await api(`/api-football/pressure?fixture=${id}&elapsed=${elapsed}`);updateQuota(d);if(!d.available)return `<section class="section pressurebox"><div class="pressurehead"><h3>График давления</h3><span class="pressurebadge">НЕТ ДАННЫХ</span></div><div class="pressurenote">${esc(d.reason||'API-Football не передал нужную статистику для этого матча')}</div></section>`;const points=d.points||[],teams=x.teams||{},current=d.current||points[points.length-1]||{home:50,away:50};return `<section class="section pressurebox"><div class="pressurehead"><h3>График давления <span>расчётный</span></h3><span class="pressurebadge">LIVE-ДАННЫЕ API</span></div><div class="pressurelegend"><div class="pressureteam">${logo(teams.home,'trendteamlogo')}<span>${esc(teams.home?.name||'Хозяева')}</span></div><div class="pressureteam"><span>${esc(teams.away?.name||'Гости')}</span>${logo(teams.away,'trendteamlogo')}</div></div><div class="pressurechart">${points.map((p,i)=>`<div class="pressurecol" title="${p.minute||'—'} мин.: ${p.home}% — ${p.away}%"><div class="pressurehalf home"><i style="height:${Math.max(8,Number(p.home)||0)}%"></i></div><div class="pressurehalf away"><i style="height:${Math.max(8,Number(p.away)||0)}%"></i></div>${i===points.length-1?`<span class="pressureminute">${p.minute||''}′</span>`:''}</div>`).join('')}</div><div class="pressurecurrent"><b>${current.home}%</b><span>текущий баланс</span><b>${current.away}%</b></div><div class="pressurenote">API-Football не отдаёт готовое поле «давление». График честно рассчитывается из ударов, ударов в створ, блокированных ударов, угловых и владения. История накапливается только пока пользователи открывают этот матч.</div></section>`}catch(e){return `<section class="section pressurebox"><div class="pressurehead"><h3>График давления</h3><span class="pressurebadge">ОШИБКА</span></div><div class="pressurenote">${esc(e.message)}</div></section>`}}
async function overviewHtml(){const x=state.selected,s=x?.fixture?.status||{},score=x?.score||{},pressure=await pressureHtml();return `<section class="section"><h3>Информация о матче</h3><div class="quick"><div><small>Статус</small><b>${esc(s.short||'—')}</b></div><div><small>Перерыв</small><b>${score.halftime?.home??'—'}:${score.halftime?.away??'—'}</b></div><div><small>Сезон</small><b>${esc(x?.league?.season||'—')}</b></div></div></section>${pressure}<section class="section"><h3>Данные загружаются по требованию <span>экономия лимита 7 500</span></h3><button class="loadbtn" onclick="loadDetailTab('stats')">Открыть полную статистику</button></section><section class="section"><h3>Быстрый доступ</h3><div class="quick"><div onclick="loadDetailTab('stats')"><small>Статистика</small><b>📊</b></div><div onclick="loadDetailTab('events')"><small>События</small><b>⚽</b></div><div onclick="loadDetailTab('matches')"><small>10 матчей</small><b>🗓️</b></div></div></section><section class="section"><div class="quick"><div onclick="loadDetailTab('table')"><small>Таблица</small><b>🏆</b></div><div onclick="loadDetailTab('lineups')"><small>Составы</small><b>👥</b></div><div onclick="loadDetailTab('trends')"><small>Тренды</small><b>📈</b></div></div></section>`}
async function loadDetailTab(tab,force=false){if(!state.selected)return;stopPressureTimer();state.tab=tab;$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const key=`${state.selected.fixture.id}:${tab}`;if(!force&&state.tabCache.has(key)){$('#detailBody').innerHTML=state.tabCache.get(key);if(tab==='overview')startPressureTimer();return}$('#detailBody').innerHTML='<div class="loading"><i></i>Загружаю данные…</div>';try{let html='';if(tab==='overview')html=await overviewHtml();else if(tab==='stats')html=await statsHtml();else if(tab==='events')html=await eventsHtml();else if(tab==='lineups')html=await lineupsHtml();else if(tab==='matches')html=await matchesTabHtml();else if(tab==='table')html=await tableTabHtml();else if(tab==='h2h')html=await h2hHtml();else if(tab==='trends')html=await trendsHtml();state.tabCache.set(key,html);$('#detailBody').innerHTML=html;if(tab==='overview')startPressureTimer()}catch(e){$('#detailBody').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
async function statsHtml(){const id=state.selected.fixture.id,d=await api(`/api-football/statistics?fixture=${id}`);updateQuota(d);const teams=d.response||[];if(teams.length<2)return'<div class="empty">Статистика пока недоступна для этого матча</div>';const home=teams[0],away=teams[1],a=new Map((home.statistics||[]).map(x=>[x.type,x.value])),b=new Map((away.statistics||[]).map(x=>[x.type,x.value]));const types=['Shots on Goal','Shots off Goal','Total Shots','Blocked Shots','Ball Possession','Corner Kicks','Offsides','Fouls','Yellow Cards','Goalkeeper Saves'];return `<section class="section"><div class="comparehead"><div class="compareteam">${logo(home.team,'teamlogo')}<div><b>${esc(home.team?.name||'Хозяева')}</b><small>${esc(state.selected.league?.name||'')}</small></div></div><div class="comparevs">VS</div><div class="compareteam away"><div><b>${esc(away.team?.name||'Гости')}</b><small>${esc(state.selected.league?.country||'')}</small></div>${logo(away.team,'teamlogo')}</div></div><div class="statgrid">${types.map(type=>`<div class="statcard">${statRow(type,a.get(type),b.get(type))}</div>`).join('')}</div></section>`}
function num(v){if(v==null)return 0;return Number(String(v).replace('%',''))||0}
function statRow(label,h,a){const hn=num(h),an=num(a),sum=hn+an,p=sum?Math.round(hn/sum*100):50;const ru={'Shots on Goal':'Удары в створ','Shots off Goal':'Удары мимо','Total Shots':'Все удары','Blocked Shots':'Заблокировано','Ball Possession':'Владение мячом','Corner Kicks':'Угловые','Offsides':'Офсайды','Fouls':'Фолы','Yellow Cards':'Жёлтые карточки','Goalkeeper Saves':'Сейвы'}[label]||label;return `<div class="statrow"><div class="statval">${h??'—'}</div><div><div class="statlabel">${esc(ru)}</div><div class="track"><i style="width:${p}%"></i><i style="width:${100-p}%"></i></div></div><div class="statval">${a??'—'}</div></div>`}
async function eventsHtml(){const id=state.selected.fixture.id,d=await api(`/api-football/events?fixture=${id}`);updateQuota(d);const items=d.response||[];if(!items.length)return'<div class="empty">Событий пока нет</div>';return `<section class="section"><h3>События матча <span>хронология</span></h3><div class="eventlist">${items.map(e=>`<article class="eventcard"><div class="eventmin">${e.time?.elapsed??'—'}′<small>${esc(e.time?.extra?`+${e.time.extra}`:'')}</small></div><div class="eventbody"><div class="eventtop"><div class="eventicon">${esc(eventIcon(e.type,e.detail))}</div><div class="eventtext"><b>${esc(e.detail||e.type||'Событие')}</b><small>${esc(e.player?.name||e.team?.name||'')} ${e.assist?.name?`· ассист ${esc(e.assist.name)}`:''}</small></div></div>${e.team?`<div class="eventteam">${logo(e.team,'teamlogo')}<span>${esc(e.team.name||'Команда')}</span></div>`:''}</div></article>`).join('')}</div></section>`}
async function lineupsHtml(){const id=state.selected.fixture.id,d=await api(`/api-football/lineups?fixture=${id}`);updateQuota(d);const items=d.response||[];if(!items.length)return'<div class="empty">Составы ещё не опубликованы</div>';return `<section class="section"><h3>Стартовые составы</h3><div class="lineups">${items.slice(0,2).map(l=>`<div class="lineup"><h4>${esc(l.team?.name||'Команда')} · ${esc(l.formation||'—')}</h4>${(l.startXI||[]).map(x=>`<div class="player"><span>${x.player?.number??''}</span>${esc(x.player?.name||'—')}</div>`).join('')}</div>`).join('')}</div></section>`}
async function h2hHtml(){const t=state.selected.teams,d=await api(`/api-football/h2h?home=${t.home.id}&away=${t.away.id}&last=5`);updateQuota(d);const items=d.response||[];if(!items.length)return'<div class="empty">Личные встречи пока недоступны</div>';rememberFixtures(items);return `<section class="section"><h3>Последние личные встречи</h3>${items.map(x=>`<div class="event" onclick="openMatch(${Number(x.fixture?.id)})"><div class="etime">${esc((x.fixture?.date||'').slice(0,10))}</div><div><b>${esc(x.teams?.home?.name||'')} ${x.goals?.home??'—'} : ${x.goals?.away??'—'} ${esc(x.teams?.away?.name||'')}</b><small>${esc(x.league?.name||'')}</small></div></div>`).join('')}</section>`}
async function trendsHtml(){const t=state.selected.teams,d=await api(`/api-football/trends?home=${t.home.id}&away=${t.away.id}&home_name=${encodeURIComponent(t.home.name)}&away_name=${encodeURIComponent(t.away.name)}`);updateQuota(d);const groups=d.groups||[],classes=['trend-outcome','trend-total','trend-btts'];return groups.map((g,gi)=>`<section class="section trendbox ${classes[gi]||'trend-outcome'}"><div class="trendhead"><h3>${esc(g.title)} <span>(${g.items?.length||0})</span></h3><div class="trendodd">—</div></div>${(g.items||[]).map(item=>`<article class="trenditem"><div class="trendlabel">${esc(item.label)}:</div>${(item.notes||[]).map(n=>{const team=n.team==='away'?t.away:t.home;return `<div class="trendnote">${logo(team,'trendteamlogo')}<span><b>${esc(n.text)}:</b> ${esc(n.stat)}.</span></div>`}).join('')}<div class="pickrow"><div class="pick">${gi===0?'🛡️':gi===1?'🔥':'⚽'} ${esc(item.pick)}</div><div class="trendodd">—</div></div></article>`).join('')}</section>`).join('')||'<div class="empty">Тренды пока недоступны</div>'}

function outcomeInfo(match,teamId){const homeId=Number(match.teams?.home?.id||0),awayId=Number(match.teams?.away?.id||0),gh=Number(match.goals?.home??0),ga=Number(match.goals?.away??0);const isHome=Number(teamId)===homeId;const gf=isHome?gh:ga,gs=isHome?ga:gh;if((match.goals?.home)==null||(match.goals?.away)==null)return {code:'—',cls:'draw'};if(gf>gs)return {code:'В',cls:'win'};if(gf<gs)return {code:'П',cls:'lose'};return {code:'Н',cls:'draw'}}
function historyRow(match,teamId){const info=outcomeInfo(match,teamId),isHome=Number(teamId)===Number(match.teams?.home?.id||0),opponent=isHome?(match.teams?.away||{}):(match.teams?.home||{}),gf=isHome?(match.goals?.home??'—'):(match.goals?.away??'—'),ga=isHome?(match.goals?.away??'—'):(match.goals?.home??'—');return `<div class="historyrow" onclick="openMatch(${Number(match.fixture?.id||0)})"><div class="resultpill ${info.cls}">${info.code}</div><div class="historymeta"><b>${isHome?'vs':'@'} ${esc(opponent.name||'—')}</b><small>${esc(match.league?.name||'')} · ${esc((match.fixture?.date||'').slice(0,10))}</small></div><div class="historyscore"><b>${gf}:${ga}</b><small>${esc(match.fixture?.status?.short||'FT')}</small></div></div>`}
function historyTeamCard(label,team,data){const items=(data?.last||[]).slice(0,10);return `<section class="historyteamcard"><div class="historyhead">${logo(team,'teamlogo')}<div><b>${esc(team.name||label)}</b><small>${esc(label)} · последние 10 матчей</small></div></div>${items.length?`<div class="historyrows">${items.map(x=>historyRow(x,team.id)).join('')}</div>`:'<div class="emptycard">Последние матчи пока недоступны</div>'}</section>`}
function tableStyledHtml(rows,leagueId,season,selectedIds){if(!rows.length)return '<section class="section tablecard"><div class="tabletitle"><h3>Турнирная таблица</h3></div><div class="emptycard">Таблица пока недоступна</div></section>';return `<section class="section tablecard"><div class="tabletitle"><h3>Турнирная таблица</h3><small>можно открыть клуб</small></div><div class="tablewrap"><table class="standing"><thead><tr><th>#</th><th>Команда</th><th>И</th><th>РМ</th><th>Форма</th><th style="text-align:right">О</th></tr></thead><tbody>${rows.map(r=>`<tr class="${(selectedIds||[]).includes(Number(r.team?.id||0))?'mine':''}"><td class="rank">${r.rank??'—'}</td><td class="teamcell" onclick="openTeam(${Number(r.team?.id||0)},${Number(leagueId||0)},${Number(season||0)})">${r.team?.logo?`<img src="${esc(r.team.logo)}" alt="">`:''}<span>${esc(r.team?.name||'—')}</span></td><td>${r.all?.played??'—'}</td><td>${r.goalsDiff??'—'}</td><td class="formcell">${esc(r.form||'—')}</td><td class="pts">${r.points??'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
async function matchesTabHtml(){const t=state.selected.teams||{},l=state.selected.league||{};const [homeData,awayData]=await Promise.all([api(`/api-football/team-profile?team=${Number(t.home?.id||0)}&league=${Number(l.id||0)}&season=${Number(l.season||0)}`),api(`/api-football/team-profile?team=${Number(t.away?.id||0)}&league=${Number(l.id||0)}&season=${Number(l.season||0)}`)]);updateQuota(homeData);updateQuota(awayData);rememberFixtures([...(homeData.last||[]),...(awayData.last||[])]);return `<section class="section compact"><h3>Последние 10 матчей <span>${esc(l.name||'')}</span></h3><div class="historysplit">${historyTeamCard('хозяева',t.home||{},homeData)}${historyTeamCard('гости',t.away||{},awayData)}</div></section>`}
async function tableTabHtml(){const l=state.selected.league||{},t=state.selected.teams||{};if(!(l.id&&l.season))return '<div class="empty">Для этого матча таблица недоступна</div>';const d=await api(`/api-football/league-view?league=${Number(l.id)}&season=${Number(l.season)}`);updateQuota(d);return tableStyledHtml(d.standings||[],Number(l.id),Number(l.season),[Number(t.home?.id||0),Number(t.away?.id||0)])}

function splitValue(obj,key,side){return obj?.[key]?.[side]??'—'}
function formHtml(form){const letters=String(form||'').slice(-10).split('');if(!letters.length)return'<div class="empty">Форма пока недоступна</div>';return `<div class="formrow">${letters.map(x=>`<span class="formbadge ${String(x).toLowerCase()}">${esc(x)}</span>`).join('')}</div>`}
function teamStatisticsHtml(d){const s=d.statistics||{},f=s.fixtures||{},gf=s.goals?.for||{},ga=s.goals?.against||{},standing=d.standing||{},league=s.league||{};if(!d.statistics)return `<section class="section"><h3>Статистика команды</h3><div class="team-stat-note">Для выбранной лиги и сезона API-Football не вернул командную статистику. Матчи клуба ниже всё равно доступны.</div></section>`;return `<section class="section"><div class="teamstats-head">${league.logo?`<img src="${esc(league.logo)}" alt="">`:''}<div><b>${esc(league.name||'Статистика сезона')}</b><small>${esc(league.country||'')} · сезон ${esc(league.season||d.context?.season||'—')}</small></div></div><div class="positioncard"><div><small>Место</small><b>${standing.rank??'—'}</b></div><div><small>Очки</small><b>${standing.points??'—'}</b></div><div><small>Разница голов</small><b>${standing.goalsDiff??'—'}</b></div></div></section><section class="section"><h3>Текущая форма <span>последние матчи</span></h3>${formHtml(s.form||standing.form)}</section><section class="section"><h3>Результаты сезона</h3><div class="quick"><div><small>Матчи</small><b>${f.played?.total??'—'}</b></div><div><small>Победы</small><b>${f.wins?.total??'—'}</b></div><div><small>Ничьи</small><b>${f.draws?.total??'—'}</b></div></div><div class="teammetric-grid" style="margin-top:7px"><div class="teammetric"><small>Поражения</small><b>${f.loses?.total??'—'}</b><em>за сезон</em></div><div class="teammetric"><small>Сухие матчи</small><b>${s.clean_sheet?.total??'—'}</b><em>без пропущенных</em></div><div class="teammetric"><small>Забито голов</small><b>${gf.total?.total??'—'}</b><em>в среднем ${gf.average?.total??'—'}</em></div><div class="teammetric"><small>Пропущено голов</small><b>${ga.total?.total??'—'}</b><em>в среднем ${ga.average?.total??'—'}</em></div><div class="teammetric"><small>Не забила</small><b>${s.failed_to_score?.total??'—'}</b><em>матчей</em></div><div class="teammetric"><small>Серия побед</small><b>${s.biggest?.streak?.wins??'—'}</b><em>максимальная</em></div></div></section><section class="section"><h3>Дома и в гостях</h3><table class="split-table"><thead><tr><th>Показатель</th><th>Дома</th><th>В гостях</th><th>Всего</th></tr></thead><tbody><tr><td>Матчи</td><td>${splitValue(f,'played','home')}</td><td>${splitValue(f,'played','away')}</td><td>${splitValue(f,'played','total')}</td></tr><tr><td>Победы</td><td>${splitValue(f,'wins','home')}</td><td>${splitValue(f,'wins','away')}</td><td>${splitValue(f,'wins','total')}</td></tr><tr><td>Ничьи</td><td>${splitValue(f,'draws','home')}</td><td>${splitValue(f,'draws','away')}</td><td>${splitValue(f,'draws','total')}</td></tr><tr><td>Поражения</td><td>${splitValue(f,'loses','home')}</td><td>${splitValue(f,'loses','away')}</td><td>${splitValue(f,'loses','total')}</td></tr><tr><td>Забито</td><td>${gf.total?.home??'—'}</td><td>${gf.total?.away??'—'}</td><td>${gf.total?.total??'—'}</td></tr><tr><td>Пропущено</td><td>${ga.total?.home??'—'}</td><td>${ga.total?.away??'—'}</td><td>${ga.total?.total??'—'}</td></tr></tbody></table></section>`}
async function openTeam(id,league=0,season=0){if(!id)return;const seed=state['team_'+id]||{};$('#teamDetail').classList.remove('hidden');document.body.style.overflow='hidden';$('#teamBody').innerHTML=`<div class="profilehero">${logo(seed.team||{},'bigfallback')}<h2>${esc(seed.team?.name||'Клуб')}</h2><p>${esc(seed.team?.country||'')}</p></div><div class="loading"><i></i>Загружаю статистику клуба…</div>`;try{const query=`team=${id}${league?`&league=${league}`:''}${season?`&season=${season}`:''}`,d=await api(`/api-football/team-profile?${query}`);updateQuota(d);state.teamProfile=d;const item=d.team||seed,t=item.team||{},v=item.venue||{};rememberFixtures([...(d.last||[]),...(d.next||[])]);state['team_'+id]=item;$('#teamBody').innerHTML=`<div class="profilehero">${logo(t,'bigfallback')}<h2>${esc(t.name||'Клуб')}</h2><p>${esc(t.country||'')}${v.city?` · ${esc(v.city)}`:''}${t.founded?` · с ${esc(t.founded)} года`:''}</p></div><div class="dbody"><section class="section"><h3>Информация</h3><div class="quick"><div><small>Страна</small><b>${esc(t.country||'—')}</b></div><div><small>Код</small><b>${esc(t.code||'—')}</b></div><div><small>Стадион</small><b>${esc(v.name||'—')}</b></div></div></section>${teamStatisticsHtml(d)}${fixtureSection('Ближайшие матчи',d.next||[])}${fixtureSection('Последние матчи',d.last||[])}</div>`}catch(e){$('#teamBody').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function fixtureSection(title,items){if(!items.length)return`<section class="section"><h3>${esc(title)}</h3><div class="empty">Данных пока нет</div></section>`;return `<section class="section"><h3>${esc(title)}</h3><div class="matches">${items.map(matchRow).join('')}</div></section>`}
async function openLeague(id,season){const seed=state['league_'+id]||{},l=seed.league||{},c=seed.country||{};$('#leagueDetail').classList.remove('hidden');document.body.style.overflow='hidden';$('#leagueBody').innerHTML=`<div class="profilehero">${l.logo?`<img src="${esc(l.logo)}" alt="">`:''}<h2>${esc(l.name||'Лига')}</h2><p>${esc(c.name||'')} · сезон ${season}</p></div><div class="loading"><i></i>Загружаю лигу…</div>`;try{const d=await api(`/api-football/league-view?league=${id}&season=${season}`);updateQuota(d);state.leagueView=d;const item=d.league||seed,lg=item?.league||l,ct=item?.country||c;rememberFixtures(d.next||[]);$('#leagueBody').innerHTML=`<div class="profilehero">${lg.logo?`<img src="${esc(lg.logo)}" alt="">`:''}<h2>${esc(lg.name||'Лига')}</h2><p>${esc(ct.name||'')} · сезон ${esc(d.season||season)}</p></div><div class="dbody">${standingsHtml(d.standings||[])}${fixtureSection('Ближайшие матчи',d.next||[])}</div>`}catch(e){$('#leagueBody').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
function standingsHtml(rows){return tableStyledHtml(rows,Number(state.leagueView?.league?.league?.id||state.leagueView?.league?.id||0),Number(state.leagueView?.season||0),[])}
function openNotify(){const host=$('#notifyHost'),frame=$('#notifyFrame');host.classList.remove('hidden');document.body.style.overflow='hidden';if(!frame.src){const suffix=(location.search||'')+(location.hash||'');frame.src='/notify/'+suffix}history.pushState({notify:true},'',location.href)}
function closeNotify(){const host=$('#notifyHost');host.classList.add('hidden');document.body.style.overflow=''}
$('#searchToggle').onclick=()=>{$('#searchrow').classList.toggle('hidden');if(!$('#searchrow').classList.contains('hidden'))setTimeout(()=>$('#searchInput').focus(),50)};
$('#searchInput').oninput=onSearchInput;$('#searchClear').onclick=clearSearch;
$('#navMatches').onclick=showMatches;$('#navLeagues').onclick=()=>{clearSearch();loadLeagues()};$('#openNotify').onclick=openNotify;$('#backMatches').onclick=closeNotify;
$$('.seg').forEach((b,i)=>b.onclick=()=>{state.filter=b.dataset.filter;$$('.seg').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#indicator').style.transform=`translateX(${i*100}%)`;renderFixtures()});
$('#closeDetail').onclick=()=>{stopPressureTimer();closeOverlay('#detail')};$('#closeTeam').onclick=()=>closeOverlay('#teamDetail');$('#closeLeague').onclick=()=>closeOverlay('#leagueDetail');$('#detailRefresh').onclick=()=>loadDetailTab(state.tab,true);$$('.tab').forEach(b=>b.onclick=()=>loadDetailTab(b.dataset.tab));
window.onpopstate=()=>{if(!$('#notifyHost').classList.contains('hidden'))closeNotify();else if(!$('#teamDetail').classList.contains('hidden'))closeOverlay('#teamDetail');else if(!$('#leagueDetail').classList.contains('hidden'))closeOverlay('#leagueDetail');else if(!$('#detail').classList.contains('hidden')){stopPressureTimer();closeOverlay('#detail')}};
buildDates();setViewUI();loadFixtures();setInterval(()=>{if(state.view==='matches'&&state.date===ymd(new Date())&&document.visibilityState==='visible'&&$('#detail').classList.contains('hidden')&&$('#teamDetail').classList.contains('hidden')&&$('#leagueDetail').classList.contains('hidden')&&$('#notifyHost').classList.contains('hidden')&&!state.query)loadFixtures()},60000);
</script>
</body>
</html>
