t-size:18px;font-weight:900}.prediction-league-title{min-width:0}.prediction-league-title b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prediction-league-title small{display:block;margin-top:4px;color:#71899b;font-size:7px}.prediction-league-head-count{color:#70c9ff;font-size:9px;font-weight:950}.prediction-league-roi{padding:6px 4px 0 46px;color:#8aa0b1;font-size:8px;font-weight:800;line-height:1.2}.prediction-league-roi.positive{color:#66d59a}.prediction-league-roi.negative{color:#ff7d88}.prediction-roi-top{padding:10px 11px;border:1px solid var(--line);border-radius:15px;background:#101b25}.prediction-roi-top-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.prediction-roi-top-title b{font-size:9px;color:#eaf4fb}.prediction-roi-top-title small{font-size:6px;color:#6f8799}.prediction-roi-top-list{display:grid;gap:5px}.prediction-roi-top-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:7px;align-items:center;min-height:26px}.prediction-roi-top-rank{color:#6faeda;font-size:8px;font-weight:950;text-align:center}.prediction-roi-top-main{min-width:0}.prediction-roi-top-main b{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prediction-roi-top-main small{display:block;margin-top:2px;color:#708899;font-size:6px}.prediction-roi-top-value-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.prediction-roi-top-value{font-size:9px;font-weight:950;color:#66d59a}.prediction-roi-top-value.negative{color:#ff7d88}.prediction-roi-top-profit{font-size:6px;color:#7f98aa;white-space:nowrap}.prediction-roi-top-toggle{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:center}.prediction-roi-top-toggle button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:#8fcfff;font-size:7px;font-weight:900;letter-spacing:.03em}.prediction-roi-top-toggle button i function buildDates(){

  box.classList.remove('hidden');
  box.classList.toggle('prediction-main-datebar',isPrediction);
  const now=new Date(),today=ymd(now);
  if(isPrediction){
    const values=predictionDateValues(now,today),selected=predictionNormalizeDate(state.date,now);
    state.date=selected;state.predictionSelectedDate=selected;
    for(const value of values){
      const d=new Date(`${value}T12:00:00`);if(Number.isNaN(d.getTime()))continue;
      const b=document.createElement('button');b.className='date'+(value===selected?' active':'');

    }
    setTimeout(()=>{const active=box.querySelector('.date.active');if(active)active.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})},20);
    return
  }
  let values=[];for(let i=-3;i<=3;i++){const d=new Date(now);d.setDate(d.getDate()+i);values.push(ymd(d))}
  for(const value of values){const d=new Date(`${value}T12:00:00`);if(Number.isNaN(d.getTime()))continue;const b=document.createElement('button');b.className='date'+(value===state.date?' active':'');const isMonthStart=d.getDate()===1;let label=value===today?'СЕГОДНЯ':(isMonthStart?d.toLocaleDateString('ru-RU',{month:'short'}).replace('.','').toUpperCase():d.toLocaleDateString('ru-RU',{weekday:'short'}).replace('.','').toUpperCase());b.innerHTML=`<small>${label}</small><b>${String(d.getDate()).padStart(2,'0')}</b>`;b.onclick=()=>{state.date=value;state.matchDate=value;buildDates();state.query='';const input=$('#searchInput');if(input)input.value='';$('#searchClear').classList.add('hidden');ensureFixturesLoaded(false)};box.appendChild(b)}

function bindLiveNotifyFrame(frame){
  if(!frame)return;
  const enableScroll=()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      doc.documentElement.style.overflowX='hidden';
      doc.documentElement.style.overflowY='auto';
      doc.documentElement.style.height='100%';
      doc.body.style.overflowX='hidden';
      doc.body.style.overflowY='auto';
      doc.body.style.height='100%';
      doc.body.style.webkitOverflowScrolling='touch';
      doc.body.style.touchAction='pan-y';
    }catch(e){}
  };
  frame.addEventListener('load',()=>{
    enableScroll();
    setTimeout(enableScroll,80);
    setTimeout(enableScroll,350);
    setTimeout(enableScroll,1000);
  });
}

function prematchPct(value,played){const p=Number(played||0);return p?Math.round(Number(value||0)*100/p):0}
function prematchCountLabel(metrics,key){const played=Number(metrics?.played||0),value=Number(metrics?.[key]||0);return played?`${value}/${played} · ${prematchPct(value,played)}%`:'—'}

function prematchWinnerClass(homeValue,awayValue,side,reverse=false){const h=Number(homeValue),a=Number(awayValue);if(!Number.isFinite(h)||!Number.isFinite(a)||h===a)return'';const homeBest=reverse?h<a:h>a;return side==='home'?(homeBest?' best':''):(homeBest?'':' best')}

function historyDateLabel(dateStr){const d=new Date(dateStr||'');if(Number.isNaN(d.getTime()))return esc(String(dateStr||'').slice(0,10));const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),target=new Date(d.getFullYear(),d.getMonth(),d.getDate());const diff=Math.round((today-target)/86400000),dm=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','');if(diff===0)return `Сегодня, ${dm}.`;if(diff===1)return `Вчера, ${dm}.`;return d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'}).replace('.','')+'.'}

function predictionPercent(value){const n=parseFloat(String(value??'').replace(',','.').replace('%',''));return Number.isFinite(n)?Math.max(0,Math.min(100,n)):0}
function predictionOddNumber(value){const n=parseFloat(String(value??'').replace(',','.'));return Number.isFinite(n)&&n>1?n:null}
function predictionNorm(value){return String(value??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ё/g,'е').replace(/[^a-zа-я0-9.]+/g,' ').trim().replace(/\s+/g,' ')}
function predictionTeamSide(winner,teams,percent){const wid=Number(winner?.id||0),homeId=Number(teams?.home?.id||0),awayId=Number(teams?.away?.id||0);if(wid&&wid===homeId)return'home';if(wid&&wid===awayId)return'away';const name=predictionNorm(winner?.name);if(name&&name===predictionNorm(teams?.home?.name))return'home';if(name&&name===predictionNorm(teams?.away?.name))return'away';const rows=[['home',predictionPercent(percent?.home)],['draw',predictionPercent(percent?.draw)],['away',predictionPercent(percent?.away)]].sort((a,b)=>b[1]-a[1]);return rows[0]?.[0]||'draw'}
function predictionTotalLabel(value){const raw=String(value||'').trim();if(!raw)return'';const n=raw.match(/(\d+(?:[.,]\d+)?)/)?.[1]?.replace(',','.')||'';if(/over|больше|тб/i.test(raw))return`ТБ ${n||''}`.trim();if(/under|меньше|тм/i.test(raw))return`ТМ ${n||''}`.trim();return raw}
function predictionModelNumber(value){if(value===null||value===undefined||typeof value==='boolean')return null;const m=String(value).replace(',','.').match(/-?\d+(?:\.\d+)?/);if(!m)return null;const n=Number(m[0]);return Number.isFinite(n)&&n>=0?n:null}
function predictionPathNumber(root,path){let value=root;for(const key of path){if(!value||typeof value!=='object')return null;value=value[key]}return predictionModelNumber(value)}

function tableRowsForMode(rows,mode){if(mode==='all')return (rows||[]).map(r=>({...r,_stats:r.all||{},_points:r.points??0,_diff:r.goalsDiff??0,_rank:r.rank??0}));const out=(rows||[]).map(r=>{const s=r?.[mode]||{},gf=Number(s.goals?.for||0),ga=Number(s.goals?.against||0),points=Number(s.win||0)*3+Number(s.draw||0);return {...r,_stats:s,_points:points,_diff:gf-ga}});out.sort((a,b)=>b._points-a._points||b._diff-a._diff||Number(b._stats?.goals?.for||0)-Number(a._stats?.goals?.for||0));return out.map((r,i)=>({...r,_rank:i+1}))}

function leagueTableHtml(rows){if(!rows.length)return '<div class="league-info-note">Таблица для этой лиги и сезона недоступна.</div>';const mode=state.leagueTableMode||'all',data=tableRowsForMode(rows,mode);return `<section class="section tablecard"><div class="tabletitle"><h3>Турнирная таблица</h3><small>${mode==='all'?'общая':mode==='home'?'дома':'в гостях'}</small></div><div class="league-mode"><button class="${mode==='all'?'active':''}" onclick="setLeagueTableMode('all')">Общая</button><button class="${mode==='home'?'active':''}" onclick="setLeagueTableMode('home')">Дома</button><button class="${mode==='away'?'active':''}" onclick="setLeagueTableMode('away')">В гостях</button></div><div class="tablewrap"><table class="standing league-table-wide"><thead><tr><th>#</th><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>ЗМ</th><th>ПМ</th><th>РМ</th><th>Форма</th><th style="text-align:right">О</th></tr></thead><tbody>${data.map(r=>`<tr><td class="rank">${r._rank??'—'}</td><td class="teamcell">${r.team?.logo?`<img src="${esc(r.team.logo)}" alt="">`:''}<span>${esc(r.team?.name||'—')}</span></td><td>${r._stats?.played??'—'}</td><td>${r._stats?.win??'—'}</td><td>${r._stats?.draw??'—'}</td><td>${r._stats?.lose??'—'}</td><td>${r._stats?.goals?.for??'—'}</td><td>${r._stats?.goals?.against??'—'}</td><td>${r._diff??'—'}</td><td class="formcell">${esc(r.form||'—')}</td><td class="pts">${r._points??'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
function leaderMetric(item,type){const s=(item?.statistics||[])[0]||{},g=s.goals||{},c=s.cards||{};if(type==='topscorers')return [g.total??0,'голов'];if(type==='topassists')return [g.assists??0,'ассистов'];if(type==='topyellowcards')return [c.yellow??0,'жёлтых'];return [c.red??0,'красных']}
function leaderBlock(title,items,type){const rows=(items||[]).slice(0,10);return `<section class="leader-block"><h3>${esc(title)}</h3>${rows.length?`<div class="leader-list">${rows.map((item,index)=>{const p=item.player||{},s=(item.statistics||[])[0]||{},team=s.team||{},metric=leaderMetric(item,type);return `<div class="leader-row"><div class="leader-rank">${index+1}</div>${p.photo?`<img class="leader-photo" src="${esc(p.photo)}" alt="">`:`<div class="leader-fallback">${esc(initials(p.name))}</div>`}<div class="leader-main"><b>${esc(p.name||'Игрок')}</b><small>${esc(team.name||'')}</small></div><div class="leader-value"><b>${metric[0]}</b><small>${metric[1]}</small></div></div>`}).join('')}</div>`:'<div class="league-info-note">Данные недоступны для этой лиги.</div>'}</section>`}
async function leagueLeadersHtml(x){const d=await api(`/api-football/league-leaders?league=${x.id}&season=${x.season}`);updateQuota(d);const l=d.leaders||{};return `${leaderBlock('Лучшие бомбардиры',l.topscorers,'topscorers')}${leaderBlock('Лучшие ассистенты',l.topassists,'topassists')}${leaderBlock('Больше всего жёлтых карточек',l.topyellowcards,'topyellowcards')}${leaderBlock('Больше всего красных карточек',l.topredcards,'topredcards')}`}
async function changeLeagueRound(value){state.leagueRound=value;for(const key of [...state.leagueCache.keys()])if(key.includes(':calendar:'))state.leagueCache.delete(key);await loadLeagueTab('calendar',true)}
async function leagueCalendarHtml(x){const q=state.leagueRound?`&round=${encodeURIComponent(state.leagueRound)}`:'';const d=await api(`/api-football/league-calendar?league=${x.id}&season=${x.season}${q}`);updateQuota(d);state.leagueRound=d.round||state.leagueRound;const fixtures=d.fixtures||[];rememberFixtures(fixtures);const rounds=d.rounds||[];return `<section class="section"><h3>Календарь по турам <span>${esc(d.round||'')}</span></h3>${rounds.length?`<select class="round-select" onchange="changeLeagueRound(this.value)">${rounds.map(r=>`<option value="${esc(r)}" ${r===d.round?'selected':''}>${esc(r)}</option>`).join('')}</select>`:''}${fixtures.length?`<div class="league-fixtures">${fixtures.map(matchRow).join('')}</div>`:'<div class="league-info-note">Матчи этого тура пока недоступны.</div>'}</section>`}
async function leagueTeamsHtml(x){const d=await api(`/api-football/league-teams?league=${x.id}&season=${x.season}`);updateQuota(d);const items=d.teams||[];return `<section class="section"><h3>Команды сезона <span>${items.length}</span></h3>${items.length?`<div class="league-team-list">${items.map(item=>{const t=item.team||{},v=item.venue||{};return `<div class="league-team-item">${logo(t,'teamlogo')}<div><b>${esc(t.name||'Команда')}</b><small>${esc(t.country||v.city||'')}</small></div></div>`}).join('')}</div>`:'<div class="league-info-note">Список команд недоступен.</div>'}</section>`}
async function leagueSeasonsHtml(x){const d=await api(`/api-football/league-seasons?league=${x.id}&season=${x.season}`);updateQuota(d);const seasons=(d.seasons||[]).slice().sort((a,b)=>Number(b.year||0)-Number(a.year||0)),winners=d.winners||[];return `<section class="section"><h3>Прошедшие сезоны <span>${seasons.length}</span></h3>${seasons.length?`<div class="season-list">${seasons.map(s=>`<div class="season-row ${s.current?'current':''}"><div><b>${esc(s.year||'—')}${s.current?' · текущий':''}</b><small>${esc(s.start||'')} — ${esc(s.end||'')}</small></div><button class="season-open" onclick="openLeague(${x.id},${Number(s.year||x.season)})">Открыть</button></div>`).join('')}</div>`:'<div class="league-info-note">Список сезонов недоступен.</div>'}</section><section class="section"><h3>Победители прошлых сезонов <span>до 5 сезонов</span></h3>${winners.length?`<div class="winner-list">${winners.map(w=>`<div class="winner-row"><div><b>${esc(w.season||'—')}</b><small>Победитель сезона</small></div>${w.team?`<div class="winner-team">${logo(w.team,'tinylogo')}<span>${esc(w.team.name||'—')}</span></div>`:'<small>Данные недоступны</small>'}</div>`).join('')}</div>`:'<div class="league-info-note">Победители недоступны: для кубков или некоторых сезонов API не возвращает таблицу.</div>'}</section>`}
function standingsHtml(rows){return leagueTableHtml(rows)}
function openNotify(){const host=$('#notifyHost'),frame=$('#notifyFrame');clearTimeout(notifyFrameOpenTimer);clearTimeout(notifyFrameCloseTimer);++state.liveCardRequest;host.classList.remove('card-transition','card-visible','card-closing','frame-ready','hidden');document.body.style.overflow='hidden';if(!frame.src){const suffix=(location.search||'')+(location.hash||'');frame.src='/notify/'+suffix}history.pushState({notify:true},'',location.href)}
function closeNotify(){const host=$('#notifyHost'),frame=$('#notifyFrame');clearTimeout(notifyFrameOpenTimer);clearTimeout(notifyFrameCloseTimer);++state.liveCardRequest;const finish=()=>{host.classList.add('hidden');host.classList.remove('card-transition','card-visible','card-closing','frame-ready');document.body.style.overflow='';if(frame){frame.onload=null;frame.style.pointerEvents='';frame.removeAttribute('src')}if(state.openedFromPrediction){state.returnToPrediction=false;state.openedFromPrediction=false;state.selectedPredictionKey=''}state.openedFromLive=false};if(host.classList.contains('card-transition')&&!host.classList.contains('hidden')){host.classList.remove('card-visible','frame-ready');host.classList.add('card-closing');notifyFrameCloseTimer=setTimeout(finish,190)}else finish()}
window.addEventListener('message',e=>{const type=e?.data?.type;if(type==='live-card-seed-ready'){const host=$('#notifyHost'),frame=$('#notifyFrame');if(host&&!host.classList.contains('hidden')){host.classList.add('frame-ready');if(frame)frame.style.pointerEvents='auto'}return}if(type==='open-live-team'){if(state.openedFromLive||state.openedFromPrediction)openLiveTeamFromApi(e.data);return}if(type==='close-live-detail'||type==='close-live-filter'){closeNotify();return}if(type==='live-filter-updated'){state.liveFilter=loadLiveMainFilter();closeNotify();renderLiveMatches();return}if(type==='notify-filter-updated'){closeNotify();return}});
$('#searchToggle').onclick=()=>{const el=$('#searchInput');if(el){el.focus();el.select&&el.select()}};
$('#searchInput').oninput=onSearchInput;
$('#searchInput').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key==='Search'){ev.preventDefault();ev.currentTarget.blur()}});
$('#searchClear').onclick=clearSearch;
function hideSearchKeyboardOnOutsideTap(ev){
  const input=$('#searchInput');
  if(!input||document.activeElement!==input)return;
  const target=ev.target;
  if(target&&(target===input||(target.closest&&target.closest('.search'))))return;
  input.blur();
}
document.addEventListener('pointerdown',hideSearchKeyboardOnOutsideTap,true);
document.addEventListener('touchstart',hideSearchKeyboardOnOutsideTap,{capture:true,passive:true});
document.addEventListener('click',ev=>{const card=ev.target.closest&&ev.target.closest('[data-search-player-id]');if(!card)return;ev.preventDefault();ev.stopPropagation();openSearchPlayer(Number(card.dataset.searchPlayerId||0))});
$('#navMatches').onclick=showMatches;$('#navLeagues').onclick=()=>{clearSearch();loadLeagues()};$('#navFavorites').onclick=()=>showFavorites(state.favoriteTab);$('#navFound').onclick=()=>renderFound(false);$('#backMatches').onclick=closeNotify;$('#openLiveFeedFilter').onclick=()=>openLiveFilterSheet('live');$('#openNotifyFilter').onclick=()=>openLiveFilterSheet('notify');
$$('.seg').forEach((b,i)=>b.onclick=()=>{const next=b.dataset.filter,wasPrediction=state.filter==='prediction';closeNotify();if(next==='prediction'&&!wasPrediction){state.matchDate=/^\d{4}-\d{2}-\d{2}$/.test(String(state.date||''))?state.date:ymd(new Date());let saved='';try{saved=localStorage.getItem('prediction-selected-date')||''}catch(e){}const preferred=predictionDateAllowed(state.predictionSelectedDate)?state.predictionSelectedDate:(predictionDateAllowed(saved)?saved:ymd(new Date()));state.date=predictionNormalizeDate(preferred);state.predictionSelectedDate=state.date}else if(next!=='prediction'&&wasPrediction){state.predictionSelectedDate=state.date;try{localStorage.setItem('prediction-selected-date',state.date)}catch(e){}state.date=/^\d{4}-\d{2}-\d{2}$/.test(String(state.matchDate||''))?state.matchDate:ymd(new Date())}state.filter=next;state.predictionLeagueKey='';state.predictionOverlayOpen=false;$('#predictionDetail').classList.add('hidden');document.body.style.overflow='';state.query='';const input=$('#searchInput');if(input)input.value='';$('#searchClear')?.classList.add('hidden');$$('.seg').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#indicator').style.transform=`translateX(${i*100}%)`;setViewUI();buildDates();if(state.filter!=='live')hideLiveSegCount();if(state.filter==='upcoming'||state.filter==='finished')ensureFixturesLoaded(false);else renderFixtures()});
$('#closeDetail').onclick=closeMatchDetail;$('#closePredictionDetail').onclick=closePredictionDetail;$('#predictionDetailRefresh').onclick=()=>renderPredictionFeed(true);$('#closePredictionLeagueStats').onclick=closePredictionLeagueStats;$('#predictionLeagueStatsRefresh').onclick=()=>openPredictionLeagueStats(true);$('#closeTeam').onclick=closeTeamDetail;$('#closeLeague').onclick=()=>closeOverlay('#leagueDetail');$('#closePlayer').onclick=closePlayer;$('#detailRefresh').onclick=()=>state.liveHybridMatchId?refreshHybridLiveCard(true):loadDetailTab(state.tab,true);$$('.tab').forEach(b=>b.onclick=()=>loadDetailTab(b.dataset.tab));

window.onpopstate=()=>{if(!$('#nativeSheetHost').classList.contains('hidden'))closeNativeSheet();else if(!$('#notifyHost').classList.contains('hidden'))closeNotify();else if(!$('#predictionLeagueStats').classList.contains('hidden'))closePredictionLeagueStats();else if(!$('#playerDetail').classList.contains('hidden'))closePlayer();else if(!$('#teamDetail').classList.contains('hidden'))closeTeamDetail();else if(!$('#leagueDetail').classList.contains('hidden'))closeOverlay('#leagueDetail');else if(!$('#detail').classList.contains('hidden'))closeMatchDetail();else if(!$('#predictionDetail').classList.contains('hidden'))closePredictionDetail()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||state.view!=='matches'||state.query)return;if(state.filter==='prediction'){if(!$('#detail').classList.contains('hidden'))return;const key=String(state.date||''),host=predictionRenderHost();predictionFeedSyncAt.set(key,0);syncPredictionFeedFromDatabase(key,host);return}if(!['upcoming','finished'].includes(state.filter))return;if(!$('#detail').classList.contains('hidden')||!$('#teamDetail').classList.contains('hidden')||!$('#leagueDetail').classList.contains('hidden')||!$('#notifyHost').classList.contains('hidden')||!$('#predictionDetail').classList.contains('hidden'))return;refreshKeepingScroll(()=>loadFixtures(false))});
window.setPredictionStatusTab=setPredictionStatusTab;window.openPredictionLeagueStats=openPredictionLeagueStats;window.openSearchPlayer=openSearchPlayer;window.openPlayer=openPlayer;window.toggleFavoriteLiveMatch=toggleFavoriteLiveMatch;
let liveResumeRefreshAt=0;
function mobileLiveRefreshAllowed(){return state.view==='matches'&&state.filter==='live'&&document.visibilityState==='visible'&&!state.query&&$('#nativeSheetHost').classList.contains('hidden')&&$('#notifyHost').classList.contains('hidden')&&$('#detail').classList.contains('hidden')&&$('#teamDetail').classList.contains('hidden')&&$('#leagueDetail').classList.contains('hidden')&&$('#predictionDetail').classList.contains('hidden')}
function refreshLiveAfterMobileResume(){if(!mobileLiveRefreshAllowed())return;const now=Date.now();if(now-liveResumeRefreshAt<4000)return;liveResumeRefreshAt=now;state.liveLoading=false;refreshKeepingScroll(()=>loadLiveMatches(true)).catch(()=>{})}
window.addEventListener('pageshow',()=>setTimeout(refreshLiveAfterMobileResume,180));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(refreshLiveAfterMobileResume,220)});
loadFavorites();buildDates();setViewUI();const bootLive=loadLiveMainCache();if(bootLive){state.livePayload=bootLive;liveBadge(livePayloadCount(bootLive));renderLiveMatches()}loadLiveMatches(false);setInterval(()=>{if(state.view==='matches'&&document.visibilityState==='visible'&&$('#detail').classList.contains('hidden')&&$('#teamDetail').classList.contains('hidden')&&$('#leagueDetail').classList.contains('hidden')&&$('#notifyHost').classList.contains('hidden')&&$('#predictionDetail').classList.contains('hidden')){if(state.filter==='live')refreshKeepingScroll(()=>loadLiveMatches(false));else if(state.filter!=='prediction'&&state.date===ymd(new Date())&&!state.query){renderFixtures();refreshKeepingScroll(()=>loadFixtures())}}} ,60000);setInterval(()=>{if(state.view!=='matches'||state.filter!=='prediction'||document.visibilityState!=='visible'||state.query||!$('#detail').classList.contains('hidden'))return;const key=String(state.date||''),host=predictionRenderHost(),cached=state.predictionFeedCache.get(key)||loadPredictionFeedLocal(key);if(!cached||state.predictionStatusTab==='finished'||predictionFeedNeedsDatabaseSync(cached)){predictionFeedSyncAt.set(key,0);syncPredictionFeedFromDatabase(key,host)}},30*1000);setInterval(()=>{if(state.view==='found'&&document.visibilityState==='visible'&&!state.foundLoading){refreshKeepingScroll(()=>renderFound(true))}},120000);
