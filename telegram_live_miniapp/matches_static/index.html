<style>
:root{color-scheme:dark;--bg:#0f1923;--panel:#172431;--panel2:#1d2c3a;--line:rgba(155,190,215,.11);--text:#eef4f8;--muted:#8499aa;--blue:#59b3f1;--green:#52dda0;--red:#ff6e7c;--amber:#ffc65b;--soft:#5d7386;--shadow:0 14px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#071018;color:var(--text)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{width:100%;max-width:430px;min-height:100vh;margin:auto;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.035),0 30px 90px rgba(0,0,0,.5);position:relative;padding-bottom:66px}.top{position:sticky;top:0;z-index:20;background:rgba(15,25,35,.98);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}.bar{height:54px;display:flex;align-items:center;padding:0 11px;gap:9px}.brandmark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eef5f8;color:#243745;font-size:17px}.brand{min-width:0}.brand h1{font-size:16px;line-height:1;margin:0;font-weight:850}.brand small{display:flex;align-items:center;gap:5px;margin-top:5px;color:var(--muted);font-size:8px;font-weight:700}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}.actions{margin-left:auto;display:flex;gap:3px}.iconbtn{width:34px;height:34px;border:0;border-radius:11px;background:transparent;color:#8196a7;display:grid;place-items:center}.iconbtn:active{background:#1d2c38}.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.datebar{display:flex;overflow:auto;scrollbar-width:none;padding:1px 4px 8px}.datebar::-webkit-scrollbar{display:none}.date{min-width:59px;height:50px;border:0;border-radius:15px;background:transparent;color:#8da1b1;padding:6px 4px}.date small,.date b{display:block}.date small{font-size:8px;font-weight:850}.date b{margin-top:5px;color:#e9f0f4;font-size:13px}.date.active{background:linear-gradient(180deg,#69baf4,#4fa7e8);box-shadow:0 7px 18px rgba(58,141,204,.27)}.date.active small,.date.active b{color ime.live{color:var(--green)}.mtime.soon{color:#7ac1f3}.pulse{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite}.teamline{height:24px;display:flex;align-items:center;gap:7px;min-width:0}.teamlogo{width:21px;height:21px;border-radius:50%;object-fit:contain;background:#eef4f7;border:1px solid rgba(255,255,255,.12);flex:0 0 21px}.fallback{display:grid;place-items:center;color:#fff;font-size:6px;font-weight:900;background:linear-gradient(145deg,#3f80b8,#1d435f)}.teamname{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:720}.score{width:18px;text-align:center;font-size:12px;font-weight:900}.mact{display:flex;align-items:center;justify-content:flex-end;color:#4e677a}.mact .icon{width:14px}.empty,.loading{padding:40px 20px;text-align:center;color:#7890a2}.loading i{display:block;width:28px;height:28px;margin:0 auto 12px;border-radius:50%;border:3px solid #243747;border-top-color:var(--blue);animation:spin .8s linear infinite}.errorbox{margin:8px;padding:12px;border-radius:13px;background:rgba(255,110,124,.09);border:1px solid rgba(255,110,124,.18);color:#ffc0c7;font-size:10px;line-height:1.45}.bottom{position:fixed;z-index:25;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:62px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr;background:#111c26;border-top:1px solid var(--line)}.nav{border:0;background:transparent;color:#5e829c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px}.nav.active{color:var(--blue)}.nav .icon{width:20px;height:20px}
.detail{position:fixed;z-index:40;inset:0;margin:auto;max-width:430px;background:var(--bg);overflow:auto;padding-bottom:20px}.dtop{position:sticky;top:0;z-index:5;height:56px;padding-top:env(safe-area-inset-top);background:rgba(15,25,35,.98);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding-left:8px;padding-right:8px}.dtitle{min-width:0;flex:1;text-align:center}.dtitle b,.dtitle small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dtitle b{font-size:11px}.dtitle small{font-size:8px;color:var(--muted);margin-top:3px}.hero{padding:14px 12px 12px;background:linear-gradient(180deg,#182735,#111c26);border-bottom:1px solid var(--line)}.herostatus{text-align:center;font-size:8px;color:var(--green);font-weight:900}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px}.dteam{text-align:center;min-width:0}.dteam img,.dteam .bigfallback{width:52px;height:52px;border-radius:18px;object-fit:contain;background:#eef4f7;margin:auto}.bigfallback{display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900;background:linear-gradient(145deg,#4c92c8,#1d415e)!important}.dteam b{display:block;margin-top:7px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bigscore{text-align:center}.bigscore strong{font-size:28px;letter-spacing:-1.2px}.bigscore small{display:block;margin-top:3px;color:var(--muted);font-size:8px}.tabs{position:sticky;top:56px;z-index:4;display:flex;overflow:auto;scrollbar-width:none;background:#101a24;border-bottom:1px solid var(--line);padding:0 5px}.tabs::-webkit-scrollbar{display:none}.tab{min-width:70px;height:42px;border:0;background:transparent;color:#7890a2;font-size:9px;font-weight:850;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.dbody{padding:9px}.section{margin-bottom:9px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#131f2a}.section h3{margin:0 0 10px;font-size:11px}.section h3 span{color:var(--muted);font-size:8px;font-weight:600}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.quick div{text-align:center;padding:10px 5px;border-radius:12px;background:#0c151d}.quick small{display:block;color:var(--muted);font-size:7px}.quick b{display:block;margin-top:4px;font-size:13px}.statrow{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:7px;margin:9px 0}.statval{text-align:center;font-size:10px;font-weight:850}.statlabel{text-align:center;color:#8da0ae;font-size:8px;margin-bottom:5px}.track{height:4px;border-radius:99px;background:#263542;overflow:hidden;display:flex}.track i:first-child{background:var(--blue)}.track i:last-child{background:#667b8c}.event{display:grid;grid-template-columns:40px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.045)}.event:last-child{border-bottom:0}.etime{color:var(--blue);font-size:9px;font-weight:900}.event b{display:block;font-size:10px}.event small{display:block;color:var(--muted);font-size:8px;margin-top:4px}.lineups{display:grid;grid-template-columns:1fr 1fr;gap:7px}.lineup{padding:9px;border-radius:12px;background:#0c151d}.lineup h4{font-size:8px;color:var(--blue);margin:0 0 7px}.player{display:flex;gap:6px;align-items:center;font-size:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}.player:last-child{border-bottom:0}.player span{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;background:#1d2b37;color:#9aabba;font-size:7px}.trendbox{background:#f8f9fa;color:#18212a}.trendhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.trendhead h3{margin:0;color:#121b24}.trendodd{min-width:48px;height:31px;border-radius:11px;background:#e8ebee;color:#16202a;display:grid;place-items:center;font-size:11px;font-weight:900}.trenditem{padding:10px;border-radius:13px;background:#fff;border:1px solid #e7ebef;margin-top:8px}.trendlabel{font-size:11px;font-weight:850}.trendnote{display:flex;gap:7px;align-items:flex-start;margin-top:7px;color:#5e6d79;font-size:10px;line-height:1.35}.trendnote .mini{width:15px;height:15px;border-radius:50%;background:#2b7eb8;flex:0 0 15px}.trendnote b{color:#16202a}.pickrow{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:9px}.pick{min-height:33px;border-radius:10px;background:#eceff1;display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:850}.loadbtn{width:100%;height:39px;border:0;border-radius:12px;background:linear-gradient(180deg,#69baf4,#4da6e7);color:#fff;font-size:10px;font-weight:900}.quota{margin:6px 9px 0;padding:7px 9px;border-radius:10px;background:#0b141c;color:#6f8799;font-size:8px;display:flex;justify-content:space-between}.quota b{color:#9bb0c0}.notifyhost{position:fixed;z-index:50;inset:0;background:#071018}.notifybar{height:48px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;background:#101a24;border-bottom:1px solid var(--line)}.notifybar button{height:38px;border:0;background:transparent;color:var(--blue);font-size:10px;font-weight:850;padding:0 12px}.notifybar b{flex:1;text-align:center;font-size:11px;padding-right:58px}.notifyframe{display:block;width:100%;height:calc(100vh - 48px - env(safe-area-inset-top));border:0;background:#071018}.skeleton{height:14px;border-radius:7px;background:linear-gradient(90deg,#172531,#233542,#172531);background-size:200% 100%;animation:shimmer 1.2s infinite;margin:8px 0}@keyframes pulse{50%{opacity:.45;transform:scale(.75)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shimmer{to{background-position:-200% 0}}@media(min-width:600px){body{padding:16px 0}.app{min-height:calc(100vh - 32px);border-radius:9px;overflow:hidden}.bottom{bottom:16px;border-radius:0 0 9px 9px}.detail,.notifyhost{top:16px;bottom:16px;height:auto;border-radius:9px;overflow:auto}}

<body>
<div class="app" id="app">
  <header class="top">
    <div class="bar"><div class="brandmark">⚽</div><div class="brand"><h1>telegram_live_miniapp</h1><small><i class="dot"></i><span id="subtitle">LIVE, прематч и статистика через API-Football</span></small></div><div class="actions"><button class="iconbtn" id="searchToggle" aria-label="Поиск"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg></button><button class="iconbtn" id="refreshBtn" aria-label="Обновить"><svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.4L3 9m0 0V4m0 5h5M4 13a8 8 0 0 0 14.7 4.4L21 15m0 0v5m0-5h-5"/></svg></button></div></div>
    <div class="datebar" id="datebar"></div>
    <nav class="segment"><i class="indicator" id="indicator"></i><button class="seg active" data-filter="all">Все</button><button class="seg" data-filter="live">LIVE</button><button class="seg" data-filter="upcoming">Скоро</button><button class="seg" data-filter="finished">Завершены</button></nav>
    <div class="searchrow hidden" id="searchrow"><label class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg><input id="searchInput" placeholder="Команда или лига" /></label><div class="statuschip"><b id="matchCount">0</b> матчей</div></div>
  </header>
  <div class="quota" id="quota"><span>API: кэш экономит запросы</span><b>лимит загружается</b></div>
  <main class="content" id="content"><div class="loading"><i></i>Загружаю матчи…</div></main>
  <nav class="bottom"><button class="nav active"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m12 3 3 4-1 5h-4L9 7l3-4ZM5 9l5 3-1 4-5 1M19 9l-5 3 1 4 5 1M9 16l3 5 3-5"/></svg>Матчи</button><button class="nav" id="openNotify"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>Уведомления</button></nav>
</div>

<section class="detail hidden" id="detail">
  <header class="dtop"><button class="iconbtn" id="closeDetail"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="dtitle"><b id="detailLeague">Матч</b><small id="detailMeta">—</small></div><button class="iconbtn" id="detailRefresh"><svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.4L3 9m0 0V4m0 5h5M4 13a8 8 0 0 0 14.7 4.4L21 15m0 0v5m0-5h-5"/></svg></button></header>
  <article class="hero"><div class="herostatus" id="detailStatus">—</div><div class="teams"><div class="dteam" id="homeTeam"></div><div class="bigscore"><strong id="detailScore">— : —</strong><small id="detailTime">—</small></div><div class="dteam" id="awayTeam"></div></div></article>
  <nav class="tabs" id="detailTabs"><button class="tab active" data-tab="overview">Обзор</button><button class="tab" data-tab="stats">Статистика</button><button class="tab" data-tab="events">События</button><button class="tab" data-tab="lineups">Составы</button><button class="tab" data-tab="h2h">H2H</button><button class="tab" data-tab="trends">Тренды</button></nav>
  <div class="dbody" id="detailBody"></div>
</section>

<section class="notifyhost hidden" id="notifyHost"><div class="notifybar"><button id="backMatches">← Матчи</button><b>Готовый бот уведомлений</b></div><iframe class="notifyframe" id="notifyFrame" title="Готовый бот уведомлений"></iframe></section>

<script>
'use strict';
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor('#101a24');tg?.setBackgroundColor('#071018')}catch(_){ }
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={date:'',filter:'all',query:'',fixtures:[],selected:null,tab:'overview',tabCache:new Map(),loading:false};
const liveCodes=new Set(['1H','HT','2H','ET','BT','P','SUSP','INT','LIVE']);
const finishedCodes=new Set(['FT','AET','PEN','CANC','ABD','AWD','WO']);
const upcomingCodes=new Set(['NS','TBD']);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function api(path){return fetch(path,{headers:{'Accept':'application/json'}}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d})}
function ymd(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function buildDates(){const bar=$('#datebar'),now=new Date(),names=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];bar.innerHTML='';for(let i=-3;i<=3;i++){const d=new Date(now);d.setDate(now.getDate()+i);const date=ymd(d);const b=document.createElement('button');b.className='date'+(i===0?' active':'');b.dataset.date=date;b.innerHTML=`<small>${i===0?'СЕГОДНЯ':names[d.getDay()]}</small><b>${String(d.getDate()).padStart(2,'0')}</b>`;b.onclick=()=>{state.date=date;$$('.date').forEach(x=>x.classList.toggle('active',x===b));loadFixtures()};bar.appendChild(b)}state.date=ymd(now)}
function statusClass(short){if(liveCodes.has(short))return'live';if(upcomingCodes.has(short))return'soon';return''}
function timeLabel(item){const f=item.fixture||{},s=f.status||{};if(liveCodes.has(s.short))return s.elapsed?`${s.elapsed}′`:s.short;if(finishedCodes.has(s.short))return s.short||'FT';try{return new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date(f.date))}catch(_){return'—'}}
function logo(team){const src=team?.logo;if(src)return `<img class="teamlogo" src="${esc(src)}" alt="" onerror="this.outerHTML='<span class=&quot;teamlogo fallback&quot;>${esc((team?.name||'?').slice(0,2).toUpperCase())}</span>'">`;return `<span class="teamlogo fallback">${esc((team?.name||'?').slice(0,2).toUpperCase())}</span>`}
function bigLogo(team){const src=team?.logo;if(src)return `<img src="${esc(src)}" alt="" onerror="this.outerHTML='<span class=&quot;bigfallback&quot;>${esc((team?.name||'?').slice(0,2).toUpperCase())}</span>'">`;return `<span class="bigfallback">${esc((team?.name||'?').slice(0,2).toUpperCase())}</span>`}
function filteredFixtures(){return state.fixtures.filter(x=>{const sh=x.fixture?.status?.short||'';const ok=state.filter==='all'||(state.filter==='live'&&liveCodes.has(sh))||(state.filter==='upcoming'&&upcomingCodes.has(sh))||(state.filter==='finished'&&finishedCodes.has(sh));const q=state.query.toLowerCase().trim();const text=`${x.teams?.home?.name||''} ${x.teams?.away?.name||''} ${x.league?.name||''} ${x.league?.country||''}`.toLowerCase();return ok&&(!q||text.includes(q))})}
function renderFixtures(){const list=filteredFixtures();$('#matchCount').textContent=list.length;const groups=new Map();for(const x of list){const l=x.league||{};const key=`${l.id||l.name}|${l.name}|${l.country}|${l.logo||''}|${l.flag||''}`;(groups.get(key)||groups.set(key,[]).get(key)).push(x)}if(!list.length){$('#content').innerHTML='<div class="empty">Матчи по выбранным условиям не найдены</div>';return}let html='';for(const [key,items] of groups){const [,name,country,llogo,flag]=key.split('|');html+=`<section class="league"><div class="leaguehead">${llogo?`<img src="${esc(llogo)}" alt="">`:`<span class="flag">${flag?'🏳️':'⚽'}</span>`}<b>${esc((country||'Мир').toUpperCase())} — ${esc((name||'Лига').toUpperCase())}</b><button>Открыть ›</button></div><div class="matches">${items.map(matchHtml).join('')}</div></section>`}$('#content').innerHTML=html;$$('.match').forEach(el=>el.onclick=()=>openDetail(Number(el.dataset.id)))}
function matchHtml(x){const f=x.fixture||{},s=f.status||{},t=x.teams||{},g=x.goals||{};return `<article class="match" data-id="${f.id}"><div class="mtime ${statusClass(s.short)}">${liveCodes.has(s.short)?'<i class="pulse"></i>':''}<span>${esc(timeLabel(x))}</span></div><div><div class="teamline">${logo(t.home)}<div class="teamname">${esc(t.home?.name||'—')}</div><b class="score">${g.home??'—'}</b></div><div class="teamline">${logo(t.away)}<div class="teamname">${esc(t.away?.name||'—')}</div><b class="score">${g.away??'—'}</b></div></div><div class="mact"><svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div></article>`}
async function loadFixtures(force=false){if(state.loading)return;state.loading=true;$('#content').innerHTML='<div class="loading"><i></i>Загружаю матчи…</div>';try{const d=await api(`/api-football/fixtures?date=${encodeURIComponent(state.date)}&timezone=Europe%2FMoscow${force?'&force=1':''}`);state.fixtures=d.response||[];updateQuota(d);renderFixtures();$('#subtitle').textContent=d.demo?'Демо-режим — добавьте API_FOOTBALL_KEY':'LIVE, прематч и статистика через API-Football'}catch(e){$('#content').innerHTML=`<div class="errorbox"><b>Не удалось загрузить матчи</b><br>${esc(e.message)}<br><br>Проверьте переменную Railway <b>API_FOOTBALL_KEY</b>.</div>`}finally{state.loading=false}}
function updateQuota(d){const q=d?._quota||d?.quota||{};const el=$('#quota');if(q.limit!=null&&q.remaining!=null)el.innerHTML=`<span>API-Football сегодня</span><b>${q.remaining.toLocaleString('ru-RU')} из ${q.limit.toLocaleString('ru-RU')} осталось</b>`;else el.innerHTML=`<span>API-Football</span><b>${d?.demo?'демо':'кэш включён'}</b>`}
function openDetail(id){state.selected=state.fixtures.find(x=>Number(x.fixture?.id)===id)||null;if(!state.selected)return;state.tab='overview';state.tabCache.clear();const x=state.selected,l=x.league||{},t=x.teams||{},g=x.goals||{},s=x.fixture?.status||{};$('#detailLeague').textContent=l.name||'Матч';$('#detailMeta').textContent=`${l.country||'Мир'} · ${l.round||''}`;$('#detailStatus').textContent=liveCodes.has(s.short)?`LIVE · ${s.elapsed||''} МИНУТА`:(finishedCodes.has(s.short)?'МАТЧ ЗАВЕРШЁН':s.long||'ПРЕДСТОЯЩИЙ МАТЧ');$('#homeTeam').innerHTML=`${bigLogo(t.home)}<b>${esc(t.home?.name||'—')}</b>`;$('#awayTeam').innerHTML=`${bigLogo(t.away)}<b>${esc(t.away?.name||'—')}</b>`;$('#detailScore').textContent=`${g.home??'—'} : ${g.away??'—'}`;$('#detailTime').textContent=timeLabel(x);$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='overview'));$('#detail').classList.remove('hidden');document.body.style.overflow='hidden';loadDetailTab('overview')}
function closeDetail(){state.selected=null;$('#detail').classList.add('hidden');document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search+location.hash)}
function baseOverview(){const x=state.selected,s=x?.fixture?.status||{},score=x?.score||{},t=x?.teams||{};return `<section class="section"><h3>Информация о матче</h3><div class="quick"><div><small>Статус</small><b>${esc(s.short||'—')}</b></div><div><small>Перерыв</small><b>${score.halftime?.home??'—'}:${score.halftime?.away??'—'}</b></div><div><small>Сезон</small><b>${esc(x?.league?.season||'—')}</b></div></div></section><section class="section"><h3>Данные загружаются по требованию <span>экономия лимита 7 500</span></h3><button class="loadbtn" onclick="loadDetailTab('stats')">Открыть полную статистику</button></section><section class="section"><h3>Быстрый доступ</h3><div class="quick"><div onclick="loadDetailTab('events')"><small>События</small><b>⚽</b></div><div onclick="loadDetailTab('lineups')"><small>Составы</small><b>👥</b></div><div onclick="loadDetailTab('trends')"><small>Тренды</small><b>📈</b></div></div></section>`}
async function loadDetailTab(tab,force=false){if(!state.selected)return;state.tab=tab;$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const key=`${state.selected.fixture.id}:${tab}`;if(!force&&state.tabCache.has(key)){$('#detailBody').innerHTML=state.tabCache.get(key);return}$('#detailBody').innerHTML='<div class="loading"><i></i>Загружаю данные…</div>';try{let html='';if(tab==='overview')html=baseOverview();else if(tab==='stats')html=await statsHtml();else if(tab==='events')html=await eventsHtml();else if(tab==='lineups')html=await lineupsHtml();else if(tab==='h2h')html=await h2hHtml();else if(tab==='trends')html=await trendsHtml();state.tabCache.set(key,html);$('#detailBody').innerHTML=html}catch(e){$('#detailBody').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`}}
async function statsHtml(){const id=state.selected.fixture.id,d=await api(`/api-football/statistics?fixture=${id}`);updateQuota(d);const teams=d.response||[];if(teams.length<2)return'<div class="empty">Статистика пока недоступна для этого матча</div>';const a=new Map((teams[0].statistics||[]).map(x=>[x.type,x.value])),b=new Map((teams[1].statistics||[]).map(x=>[x.type,x.value]));const types=['Shots on Goal','Shots off Goal','Total Shots','Blocked Shots','Ball Possession','Corner Kicks','Offsides','Fouls','Yellow Cards','Goalkeeper Saves'];return `<section class="section"><h3>Полная статистика</h3>${types.map(type=>statRow(type,a.get(type),b.get(type))).join('')}</section>`}
function num(v){if(v==null)return 0;return Number(String(v).replace('%',''))||0}
function statRow(label,h,a){const hn=num(h),an=num(a),sum=hn+an,p=sum?Math.round(hn/sum*100):50;const ru={'Shots on Goal':'Удары в створ','Shots off Goal':'Удары мимо','Total Shots':'Все удары','Blocked Shots':'Заблокировано','Ball Possession':'Владение мячом','Corner Kicks':'Угловые','Offsides':'Офсайды','Fouls':'Фолы','Yellow Cards':'Жёлтые карточки','Goalkeeper Saves':'Сейвы'}[label]||label;return `<div class="statrow"><div class="statval">${h??'—'}</div><div><div class="statlabel">${esc(ru)}</div><div class="track"><i style="width:${p}%"></i><i style="width:${100-p}%"></i></div></div><div class="statval">${a??'—'}</div></div>`}
async function eventsHtml(){const id=state.selected.fixture.id,d=await api(`/api-football/events?fixture=${id}`);updateQuota(d);const items=d.response||[];if(!items.length)return'<div class="empty">Событий пока нет</div>';return `<section class="section"><h3>События матча</h3>${items.map(e=>`<div class="event"><div class="etime">${e.time?.elapsed??'—'}′</div><div><b>${esc(eventIcon(e.type,e.detail))} ${esc(e.detail||e.type||'Событие')}</b><small>${esc(e.player?.name||e.team?.name||'')} ${e.assist?.name?`· ${esc(e.assist.name)}`:''}</small></div></div>`).join('')}</section>`}
function eventIcon(type,detail){if(type==='Goal')return'⚽';if(type==='Card')return detail?.includes('Red')?'🟥':'🟨';if(type==='subst')return'⇄';return'•'}
async function lineupsHtml(){const id=state.selected.fixture.id,d=await api(`/api-football/lineups?fixture=${id}`);updateQuota(d);const items=d.response||[];if(!items.length)return'<div class="empty">Составы ещё не опубликованы</div>';return `<section class="section"><h3>Стартовые составы</h3><div class="lineups">${items.slice(0,2).map(l=>`<div class="lineup"><h4>${esc(l.team?.name||'Команда')} · ${esc(l.formation||'—')}</h4>${(l.startXI||[]).map(x=>`<div class="player"><span>${x.player?.number??'—'}</span>${esc(x.player?.name||'—')}</div>`).join('')}</div>`).join('')}</div></section>`}
async function h2hHtml(){const t=state.selected.teams,d=await api(`/api-football/h2h?home=${t.home.id}&away=${t.away.id}&last=5`);updateQuota(d);const items=d.response||[];if(!items.length)return'<div class="empty">Личные встречи пока недоступны</div>';return `<section class="section"><h3>Последние личные встречи</h3>${items.map(x=>`<div class="event"><div class="etime">${esc((x.fixture?.date||'').slice(0,10))}</div><div><b>${esc(x.teams?.home?.name||'')} ${x.goals?.home??'—'} : ${x.goals?.away??'—'} ${esc(x.teams?.away?.name||'')}</b><small>${esc(x.league?.name||'')}</small></div></div>`).join('')}</section>`}
async function trendsHtml(){const t=state.selected.teams,d=await api(`/api-football/trends?home=${t.home.id}&away=${t.away.id}&home_name=${encodeURIComponent(t.home.name)}&away_name=${encodeURIComponent(t.away.name)}`);updateQuota(d);const groups=d.groups||[];return groups.map(g=>`<section class="section trendbox"><div class="trendhead"><h3>${esc(g.title)} <span>(${g.items?.length||0})</span></h3><div class="trendodd">—</div></div>${(g.items||[]).map(item=>`<article class="trenditem"><div class="trendlabel">${esc(item.label)}:</div>${(item.notes||[]).map(n=>`<div class="trendnote"><i class="mini"></i><span><b>${esc(n.text)}:</b> ${esc(n.stat)}.</span></div>`).join('')}<div class="pickrow"><div class="pick">🔥 ${esc(item.pick)}</div><div class="trendodd">—</div></div></article>`).join('')}</section>`).join('')||'<div class="empty">Тренды пока недоступны</div>'}
function openNotify(){const host=$('#notifyHost'),frame=$('#notifyFrame');host.classList.remove('hidden');document.body.style.overflow='hidden';if(!frame.src){const suffix=(location.search||'')+(location.hash||'');frame.src='/notify/'+suffix}history.pushState({notify:true},'',location.href)}
function closeNotify(){const host=$('#notifyHost');host.classList.add('hidden');document.body.style.overflow=''}
$('#searchToggle').onclick=()=>$('#searchrow').classList.toggle('hidden');$('#searchInput').oninput=e=>{state.query=e.target.value;renderFixtures()};$('#refreshBtn').onclick=()=>loadFixtures(true);$$('.seg').forEach((b,i)=>b.onclick=()=>{state.filter=b.dataset.filter;$$('.seg').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#indicator').style.transform=`translateX(${i*100}%)`;renderFixtures()});$('#closeDetail').onclick=closeDetail;$('#detailRefresh').onclick=()=>loadDetailTab(state.tab,true);$$('.tab').forEach(b=>b.onclick=()=>loadDetailTab(b.dataset.tab));$('#openNotify').onclick=openNotify;$('#backMatches').onclick=closeNotify;window.onpopstate=()=>{if(!$('#notifyHost').classList.contains('hidden'))closeNotify();else if(!$('#detail').classList.contains('hidden'))closeDetail()};
buildDates();loadFixtures();setInterval(()=>{if(state.date===ymd(new Date())&&document.visibilityState==='visible'&&$('#detail').classList.contains('hidden')&&$('#notifyHost').classList.contains('hidden'))loadFixtures()},60000);
</script>
